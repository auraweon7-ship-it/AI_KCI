<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A&D AGE ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e9ef; --mut:#8b93a5; --brand:#4f7cff; --brand2:#6c8cff;
    --ok:#27c093; --warn:#f5a623; --bad:#ef5350; --chip:#252a35;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .hide{display:none!important}
  .mut{color:var(--mut)}
  .row{display:flex;gap:12px;align-items:center}
  .spread{display:flex;justify-content:space-between;align-items:center}
  .grid{display:grid;gap:16px}

  /* ===== Login ===== */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:40px;max-width:400px;width:100%;text-align:center}
  .logo{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .logo span{color:var(--brand2)}
  .gbtn{margin-top:24px;width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:#222;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
  .gbtn:hover{background:#f1f1f1}

  /* ===== App layout ===== */
  #app{display:flex;min-height:100vh}
  .side{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side .logo{font-size:20px;padding:6px 8px 18px}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--mut);padding:11px 12px;border-radius:9px;font-size:14px;font-weight:500}
  .nav button .ic{width:20px;text-align:center}
  .nav button:hover{background:var(--panel2);color:var(--txt)}
  .nav button.active{background:var(--brand);color:#fff}
  .nav button .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 7px;min-width:18px;text-align:center}
  .nav button.active .badge{background:#fff;color:var(--brand)}
  .me{border-top:1px solid var(--line);padding-top:14px;font-size:13px}
  .me .av{width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
  .me .av img{width:100%;height:100%;object-fit:cover}
  .logout{margin-top:10px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut)}
  .logout:hover{color:var(--bad);border-color:var(--bad)}

  .main{flex:1;padding:26px 30px;max-width:1200px}
  h1.page{font-size:22px;margin:0 0 4px}
  .sub{color:var(--mut);margin-bottom:22px}

  /* ===== Components ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card .k{color:var(--mut);font-size:13px}
  .card .v{font-size:26px;font-weight:800;margin-top:6px}
  .card .v.sm{font-size:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
  .panel h3{margin:0 0 14px;font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .c-planning{background:#33373f;color:#cfd6e4}
  .c-plan_approved{background:#2a3a5a;color:#9fc2ff}
  .c-contracted,.c-in_progress{background:#163a30;color:#5fe0b6}
  .c-completed{background:#26323a;color:#7fb6d6}
  .c-canceled{background:#3a2326;color:#ff9a9a}
  .c-pending{background:#3a3320;color:#f5cd7a}
  .c-approved{background:#163a30;color:#5fe0b6}
  .c-rejected{background:#3a2326;color:#ff9a9a}

  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:10px 12px;border-radius:9px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:70px}
  label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
  .btn{background:var(--brand);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px}
  .btn:hover{background:var(--brand2)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.warn{background:var(--warn);color:#1a1a1a}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 4px}
  .modal .x{float:right;background:none;border:none;color:var(--mut);font-size:20px}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
    padding:12px 20px;border-radius:10px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
  #toast.show{opacity:1}
  #toast.err{border-color:var(--bad);color:#ffb4b4}

  .pending-box{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .att-big{display:flex;gap:14px;flex-wrap:wrap}
  .att-big .btn{flex:1;min-width:140px;padding:22px;font-size:16px}
  @media(max-width:820px){
    #app{flex-direction:column}
    .side{width:100%;height:auto;position:relative;flex-direction:column}
    .nav{flex-direction:row;flex-wrap:wrap}
    .main{padding:18px}
  }
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="login">
  <div class="login-card">
    <div class="logo">A&amp;D <span>AGE</span> ERP</div>
    <p class="mut" style="margin-top:8px">사내 통합 경영 시스템</p>
    <button class="gbtn" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.4-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.3 0-11.7-3.7-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Google 계정으로 로그인
    </button>
    <p class="mut" style="margin-top:18px;font-size:12px">회사 구글 계정으로만 로그인할 수 있습니다.</p>
  </div>
</div>

<!-- ========== PENDING ========== -->
<div id="pending" class="pending-box hide">
  <div class="login-card">
    <div class="logo">승인 대기중</div>
    <p class="mut" style="margin-top:12px">계정이 등록되었습니다.<br>관리자 승인 후 이용할 수 있습니다.</p>
    <p id="pendingEmail" class="mut" style="margin-top:10px;font-size:12px"></p>
    <button class="logout" style="max-width:200px;margin:20px auto 0" onclick="signOut()">로그아웃</button>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app" class="hide">
  <aside class="side">
    <div class="logo">A&amp;D <span>AGE</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <div class="row">
        <div class="av" id="meAv"></div>
        <div style="overflow:hidden">
          <div id="meName" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
          <div class="mut" id="meRole" style="font-size:11px"></div>
        </div>
      </div>
      <button class="logout" onclick="myProfileForm()" style="margin-top:10px">내 정보 수정</button>
      <button class="logout" onclick="signOut()">로그아웃</button>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
// ===================== CONFIG =====================
const SUPABASE_URL = 'https://kaupqakpfnxheegykxfg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_STP03xYbUg16ziET8eQ1PQ_z24abwDJ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEPT = {ceo:'대표',planning_marketing:'기획/마케팅',webapp_dev:'웹앱개발',webplatform_dev:'웹플랫폼개발',design_content:'디자인/콘텐츠',operation:'운영'};
const ROLE = {admin:'관리자',manager:'중간관리자',member:'사용자'};
const PSTATUS = {planning:'기획',plan_approved:'기획승인',contracted:'계약',in_progress:'개발진행',completed:'완료',canceled:'파기'};
const PTYPE = {webapp:'웹앱',webplatform:'웹플랫폼',etc:'기타'};
const LTYPE = {annual:'연차',half_am:'오전반차',half_pm:'오후반차',sick:'병가',special:'경조'};
const ATYPE = {planning:'프로젝트 기획 승인',contract:'선계약금 승인(계약)',cancel:'프로젝트 파기 승인'};
const ASTATUS = {draft:'작성중',pending:'대기',approved:'승인',rejected:'반려'};

let ME = null;          // my profile
let CURRENT = 'dash';

// ===================== HELPERS =====================
const $ = s => document.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const won = n => (Number(n)||0).toLocaleString('ko-KR')+'원';
const won_m = n => { n=Number(n)||0; return n>=1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,'')+'억' : n>=1e4 ? Math.round(n/1e4)+'만' : n+''; };
const fmtDate = d => d ? new Date(d).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}) : '-';
const fmtTime = d => d ? new Date(d).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '-';
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip = (map,k) => `<span class="chip c-${k}">${map[k]||k}</span>`;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='show'+(err?' err':'');setTimeout(()=>t.className='',2600);}
function err(e){console.error(e);toast((e&&e.message)||'오류가 발생했습니다',true);}
const isMgr = ()=> ME && (ME.role==='admin'||ME.role==='manager');
const isAdmin = ()=> ME && ME.role==='admin';

function modal(html){
  const root=$('#modalRoot');
  root.innerHTML='';
  const m=el(`<div class="modal"><div class="box">${html}</div></div>`);
  m.addEventListener('click',e=>{if(e.target===m)root.innerHTML='';});
  root.appendChild(m);
}
function closeModal(){$('#modalRoot').innerHTML='';}

// ===================== AUTH =====================
async function signIn(){
  const {error} = await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error) err(error);
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ show('login'); return; }
  const {data:prof,error} = await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error){ err(error); show('login'); return; }
  ME = prof;
  if(ME.status!=='active'){
    $('#pendingEmail').textContent = ME.email;
    show('pending'); return;
  }
  renderShell();
  show('app');
  go(CURRENT);
}
function show(which){
  for(const id of ['login','pending','app']) $('#'+id).classList.toggle('hide', id!==which);
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN') boot(); });

// ===================== SHELL / NAV =====================
function navItems(){
  const items=[
    ['dash','📊','대시보드'],
    ['attend','🕒','근태'],
    ['leave','🌴','휴가'],
    ['project','📁','프로젝트'],
    ['approval','✍️','전자결재'],
  ];
  if(isAdmin()){ items.push(['revenue','💰','매출']); items.push(['admin','⚙️','직원관리']); }
  return items;
}
function renderShell(){
  $('#meName').textContent = ME.full_name||ME.email;
  $('#meRole').textContent = `${ROLE[ME.role]}${ME.department?' · '+DEPT[ME.department]:''}`;
  const av=$('#meAv');
  av.innerHTML = ME.avatar_url ? `<img src="${esc(ME.avatar_url)}">` : esc((ME.full_name||'?')[0]);
  const nav=$('#nav'); nav.innerHTML='';
  navItems().forEach(([k,ic,label])=>{
    const b=el(`<button data-k="${k}"><span class="ic">${ic}</span>${label}<span class="badge hide" data-badge="${k}">0</span></button>`);
    b.onclick=()=>go(k);
    nav.appendChild(b);
  });
  refreshBadges();
}
async function refreshBadges(){
  if(!isMgr()) return;
  const [ap,lv]=await Promise.all([
    sb.from('approvals').select('id',{count:'exact',head:true}).eq('status','pending'),
    sb.from('leaves').select('id',{count:'exact',head:true}).eq('status','pending').neq('user_id',ME.id),
  ]);
  setBadge('approval', ap.count||0);
  setBadge('leave', lv.count||0);
}
function setBadge(k,n){
  const b=document.querySelector(`[data-badge="${k}"]`);
  if(!b)return; b.textContent=n; b.classList.toggle('hide', !n);
}
function go(k){
  CURRENT=k;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  const v=$('#view'); v.innerHTML='<p class="mut">불러오는 중…</p>';
  ({dash:viewDash,attend:viewAttend,leave:viewLeave,project:viewProject,approval:viewApproval,revenue:viewRevenue,admin:viewAdmin}[k])();
  refreshBadges();
}

// ===================== DASHBOARD =====================
async function viewDash(){
  const v=$('#view');
  const [proj, asg, att, appr] = await Promise.all([
    sb.from('projects').select('*'),
    sb.from('assignments').select('*'),
    sb.from('attendance').select('*').eq('user_id',ME.id).eq('work_date',todayStr()).maybeSingle(),
    sb.from('approvals').select('*').eq('status','pending'),
  ]);
  const projects = proj.data||[];
  const active = projects.filter(p=>['plan_approved','contracted','in_progress'].includes(p.status));
  const myToday = att.data;
  let revTotal=0;
  if(isAdmin()){
    const r=await sb.from('revenue').select('amount');
    revTotal=(r.data||[]).reduce((s,x)=>s+Number(x.amount),0);
  }
  const myAsg=(asg.data||[]).filter(a=>a.user_id===ME.id).length;

  v.innerHTML='';
  v.appendChild(el(`<div><h1 class="page">대시보드</h1><div class="sub">${esc(ME.full_name||'')} 님, 환영합니다 · ${todayStr()}</div></div>`));
  const cards=el(`<div class="cards"></div>`);
  const C=(k,val,sm)=>cards.appendChild(el(`<div class="card"><div class="k">${k}</div><div class="v ${sm?'sm':''}">${val}</div></div>`));
  C('진행중 프로젝트', active.length);
  C('전체 프로젝트', projects.length);
  C('오늘 근무', myToday? (myToday.check_out?'퇴근완료':'근무중') : '미출근', true);
  C('내 투입 프로젝트', myAsg);
  if(isAdmin()) C('누적 매출', won_m(revTotal), true);
  if(isMgr()) C('결재 대기', (appr.data||[]).length);
  v.appendChild(cards);

  // pipeline
  const pipe=el(`<div class="panel"><h3>프로젝트 파이프라인</h3></div>`);
  const order=['planning','plan_approved','contracted','in_progress','completed','canceled'];
  const tbl=el(`<table><thead><tr><th>고객사</th><th>프로젝트</th><th>유형</th><th>상태</th><th>진행률</th>${isAdmin()?'<th>계약금</th>':''}</tr></thead><tbody></tbody></table>`);
  const tb=tbl.querySelector('tbody');
  projects.sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status));
  if(!projects.length) tb.innerHTML=`<tr><td colspan="6" class="mut">프로젝트가 없습니다.</td></tr>`;
  projects.slice(0,10).forEach(p=>{
    tb.appendChild(el(`<tr><td>${esc(p.client_name)}</td><td>${esc(p.name)}</td><td>${PTYPE[p.type]}</td><td>${chip(PSTATUS,p.status)}</td><td>${p.progress}%</td>${isAdmin()?`<td>${won_m(p.contract_amount)}</td>`:''}</tr>`));
  });
  pipe.appendChild(tbl);
  v.appendChild(pipe);

  // ===== 차트 + 인력 투입 현황 =====
  const charts=el(`<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"></div>`);
  // 프로젝트 상태 분포 (전원)
  const c1=el(`<div class="panel"><h3>프로젝트 상태 분포</h3><canvas id="chStatus" height="200"></canvas></div>`);
  charts.appendChild(c1);
  // 관리자: 월별 매출 추이 / 그 외: 빈자리
  let revData=null;
  if(isAdmin()){
    const r=await sb.from('revenue').select('amount,recognized_date');
    revData=r.data||[];
    charts.appendChild(el(`<div class="panel"><h3>월별 매출 추이</h3><canvas id="chRev" height="200"></canvas></div>`));
  }
  v.appendChild(charts);

  // 인력 투입 현황 (관리자/중간관리자)
  if(isMgr()){
    const {data:people}=await sb.from('profiles').select('id,full_name,department').eq('status','active');
    const activeIds=new Set(active.map(p=>p.id));
    const load={};
    (asg.data||[]).forEach(a=>{ if(activeIds.has(a.project_id)) load[a.user_id]=(load[a.user_id]||0)+a.allocation_pct; });
    const wp=el(`<div class="panel"><h3>인력 투입 현황 (진행중 프로젝트 기준)</h3></div>`);
    const wt=el(`<table><thead><tr><th>이름</th><th>부서</th><th>투입율 합계</th><th>상태</th></tr></thead><tbody></tbody></table>`);
    const wtb=wt.querySelector('tbody');
    (people||[]).sort((a,b)=>(load[b.id]||0)-(load[a.id]||0)).forEach(p=>{
      const pct=load[p.id]||0;
      const st = pct>100?'<span class="chip c-canceled">과부하</span>':pct===0?'<span class="chip c-planning">여유</span>':pct>=80?'<span class="chip c-in_progress">적정</span>':'<span class="chip c-plan_approved">보통</span>';
      const bar=`<div style="background:var(--panel2);border-radius:6px;overflow:hidden;height:8px;margin-top:4px"><div style="width:${Math.min(pct,100)}%;height:100%;background:${pct>100?'var(--bad)':'var(--brand)'}"></div></div>`;
      wtb.appendChild(el(`<tr><td>${esc(p.full_name)}</td><td>${DEPT[p.department]||'-'}</td><td>${pct}%${bar}</td><td>${st}</td></tr>`));
    });
    if(!(people||[]).length) wtb.innerHTML=`<tr><td colspan="4" class="mut">직원 없음</td></tr>`;
    wp.appendChild(wt); v.appendChild(wp);
  }

  // draw charts
  drawCharts(projects, revData);
}
let _charts=[];
function drawCharts(projects, revData){
  _charts.forEach(c=>{try{c.destroy()}catch(e){}}); _charts=[];
  const txt='#8b93a5';
  // 상태 분포 doughnut
  const cnt={};
  projects.forEach(p=>cnt[p.status]=(cnt[p.status]||0)+1);
  const sEl=document.getElementById('chStatus');
  if(sEl) _charts.push(new Chart(sEl,{type:'doughnut',
    data:{labels:Object.keys(cnt).map(k=>PSTATUS[k]),datasets:[{data:Object.values(cnt),
      backgroundColor:['#33373f','#4f7cff','#27c093','#27c093','#7fb6d6','#ef5350']}]},
    options:{plugins:{legend:{labels:{color:txt}}}}}));
  // 매출 추이 line
  const rEl=document.getElementById('chRev');
  if(rEl&&revData){
    const bm={};
    revData.forEach(r=>{const m=(r.recognized_date||'').slice(0,7);bm[m]=(bm[m]||0)+Number(r.amount);});
    const months=Object.keys(bm).sort();
    _charts.push(new Chart(rEl,{type:'line',
      data:{labels:months,datasets:[{label:'매출(원)',data:months.map(m=>bm[m]),
        borderColor:'#4f7cff',backgroundColor:'rgba(79,124,255,.15)',fill:true,tension:.3}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:txt}},y:{ticks:{color:txt,callback:v=>won_m(v)}}}}}));
  }
}

async function viewRevenue(){
  const v=$('#view');
  const {data:rev}=await sb.from('revenue').select('*,projects(name,client_name)').order('recognized_date',{ascending:false});
  const total=(rev||[]).reduce((s,r)=>s+Number(r.amount),0);
  const byMonth={};
  (rev||[]).forEach(r=>{const m=(r.recognized_date||'').slice(0,7);byMonth[m]=(byMonth[m]||0)+Number(r.amount);});
  v.innerHTML='';
  v.appendChild(el(`<div><h1 class="page">매출</h1><div class="sub">계약 승인 시 자동 집계 · 관리자 전용</div></div>`));
  const cards=el(`<div class="cards"></div>`);
  cards.appendChild(el(`<div class="card"><div class="k">누적 매출</div><div class="v">${won_m(total)}</div></div>`));
  const months=Object.keys(byMonth).sort().reverse();
  if(months[0]) cards.appendChild(el(`<div class="card"><div class="k">${months[0]} 매출</div><div class="v sm">${won_m(byMonth[months[0]])}</div></div>`));
  cards.appendChild(el(`<div class="card"><div class="k">매출 건수</div><div class="v">${(rev||[]).length}</div></div>`));
  v.appendChild(cards);

  const p=el(`<div class="panel"><h3>매출 상세</h3></div>`);
  const t=el(`<table><thead><tr><th>인식일</th><th>프로젝트</th><th>고객사</th><th>구분</th><th style="text-align:right">금액</th></tr></thead><tbody></tbody></table>`);
  const tb=t.querySelector('tbody');
  (rev||[]).forEach(r=>tb.appendChild(el(`<tr><td>${r.recognized_date}</td><td>${esc(r.projects?.name)}</td><td class="mut">${esc(r.projects?.client_name)}</td><td>${({advance:'선계약금',balance:'잔금',etc:'조정'})[r.type]}</td><td style="text-align:right;${r.amount<0?'color:var(--bad)':''}">${won(r.amount)}</td></tr>`)));
  if(!(rev||[]).length) tb.innerHTML=`<tr><td colspan="5" class="mut">매출 내역이 없습니다. (계약 결재 승인 시 자동 생성)</td></tr>`;
  p.appendChild(t); v.appendChild(p);
}

// ===================== ADMIN (직원관리) =====================
async function viewAdmin(){
  const v=$('#view');
  const {data:people}=await sb.from('profiles').select('*').order('created_at');
  v.innerHTML='';
  v.appendChild(el(`<div><h1 class="page">직원관리</h1><div class="sub">계정 승인 · 권한 · 부서 관리</div></div>`));
  const pend=(people||[]).filter(p=>p.status==='pending');
  if(pend.length){
    const pp=el(`<div class="panel"><h3>승인 대기 (${pend.length})</h3></div>`);
    const t=el(`<table><thead><tr><th>이메일</th><th>이름</th><th></th></tr></thead><tbody></tbody></table>`);
    const tb=t.querySelector('tbody');
    pend.forEach(p=>{
      const tr=el(`<tr><td>${esc(p.email)}</td><td>${esc(p.full_name)}</td><td></td></tr>`);
      const b=el(`<button class="btn ok sm">승인</button>`); b.onclick=()=>{ closeModal(); empForm(p.id,true); };
      tr.lastChild.appendChild(b); tb.appendChild(tr);
    });
    pp.appendChild(t); v.appendChild(pp);
  }
  const p=el(`<div class="panel"><h3>전체 직원 (${(people||[]).length})</h3></div>`);
  const t=el(`<table><thead><tr><th>이름</th><th>이메일</th><th>부서</th><th>권한</th><th>상태</th><th>연차</th><th></th></tr></thead><tbody></tbody></table>`);
  const tb=t.querySelector('tbody');
  (people||[]).forEach(p=>{
    const tr=el(`<tr><td>${esc(p.full_name)}</td><td class="mut">${esc(p.email)}</td><td>${DEPT[p.department]||'-'}</td><td>${ROLE[p.role]}</td><td>${chip({active:'approved',pending:'pending',inactive:'rejected'},p.status==='active'?'approved':p.status==='pending'?'pending':'rejected')}</td><td>${(p.annual_leave_total-p.annual_leave_used).toFixed(1)}/${p.annual_leave_total}</td><td></td></tr>`);
    const b=el(`<button class="btn ghost sm">수정</button>`); b.onclick=()=>empForm(p.id,false);
    tr.lastChild.appendChild(b); tb.appendChild(tr);
  });
  p.appendChild(t); v.appendChild(p);
}
async function empForm(id,activate){
  const {data:p}=await sb.from('profiles').select('*').eq('id',id).single();
  modal(`<button class="x" onclick="closeModal()">×</button><h3>직원 정보</h3><p class="mut">${esc(p.email)}</p>
    <label class="f">이름</label><input id="ef" value="${esc(p.full_name)||''}">
    <label class="f">부서</label><select id="ed">${Object.entries(DEPT).map(([k,v])=>`<option value="${k}" ${p.department===k?'selected':''}>${v}</option>`).join('')}</select>
    <label class="f">권한</label><select id="er">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${p.role===k?'selected':''}>${v}</option>`).join('')}</select>
    <label class="f">상태</label><select id="es">${Object.entries({active:'활성',pending:'대기',inactive:'비활성'}).map(([k,v])=>`<option value="${k}" ${p.status===k||(activate&&k==='active')?'selected':''}>${v}</option>`).join('')}</select>
    <label class="f">연차 총량(일)</label><input id="el" type="number" step="0.5" value="${p.annual_leave_total}">
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="saveEmp('${id}')">저장</button>
    </div>`);
}
async function saveEmp(id){
  const {error}=await sb.from('profiles').update({
    full_name:$('#ef').value, department:$('#ed').value, role:$('#er').value,
    status:$('#es').value, annual_leave_total:Number($('#el').value)||0
  }).eq('id',id);
  if(error)return err(error); closeModal(); toast('저장 완료'); viewAdmin();
}

// ===================== 내 정보 수정 =====================
function myProfileForm(){
  modal(`<button class="x" onclick="closeModal()">×</button><h3>내 정보 수정</h3>
    <p class="mut">${esc(ME.email)}</p>
    <label class="f">이름</label><input id="mf" value="${esc(ME.full_name)||''}">
    <label class="f">부서</label><select id="md"><option value="">미지정</option>${Object.entries(DEPT).map(([k,v])=>`<option value="${k}" ${ME.department===k?'selected':''}>${v}</option>`).join('')}</select>
    <label class="f">입사일</label><input id="mh" type="date" value="${ME.hire_date||''}">
    <div style="margin-top:14px;padding:12px;background:var(--panel2);border-radius:9px;font-size:12px" class="mut">
      권한: <b style="color:var(--txt)">${ROLE[ME.role]}</b> · 상태: <b style="color:var(--txt)">${({active:'활성',pending:'대기',inactive:'비활성'})[ME.status]}</b><br>
      연차: <b style="color:var(--txt)">${(ME.annual_leave_total-ME.annual_leave_used).toFixed(1)}/${ME.annual_leave_total}일</b>
      <div style="margin-top:6px">※ 권한·상태·연차는 관리자만 변경할 수 있습니다.</div>
    </div>
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="saveMyProfile()">저장</button>
    </div>`);
}
async function saveMyProfile(){
  const full_name=$('#mf').value.trim();
  if(!full_name) return toast('이름을 입력하세요',true);
  const upd={full_name, department:$('#md').value||null, hire_date:$('#mh').value||null};
  const {error}=await sb.from('profiles').update(upd).eq('id',ME.id);
  if(error) return err(error);
  const {data:fresh}=await sb.from('profiles').select('*').eq('id',ME.id).single();
  if(fresh) ME=fresh;
  closeModal(); renderShell(); toast('내 정보 저장 완료'); go(CURRENT);
}

// ===================== START =====================
boot();
</script>
