<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>古文 학습 마스터 · 고문 마스터</title>

<!-- ===== 외부 라이브러리 (CDN) ===== -->
<!-- Tailwind CSS: 유틸리티 기반 스타일링 -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome: 아이콘 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<!-- Chart.js: 학습 통계 차트 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- Google Fonts: 한글 본문 / 고문 명조 / 한문 명조 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />

<!-- ===== Tailwind 테마 확장 ===== -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    '#2b2b2b',   // 먹색
          navy:   '#1f3a5f',   // 짙은 남색
          gold:   '#b8860b',   // 금색
          brown:  '#6b4f3a',   // 갈색
          paper:  '#f7f3ea',   // 따뜻한 미색 (배경)
          correct:'#16a34a',   // 정답 녹색
          wrong:  '#dc2626',   // 오답 붉은색
          review: '#7c3aed',   // 복습 보라색
        },
        fontFamily: {
          sans:  ['"Noto Sans KR"', 'sans-serif'],
          serif: ['"Noto Serif KR"', 'serif'],
          han:   ['"Noto Serif SC"', '"Noto Serif KR"', 'serif'],
        }
      }
    }
  }
</script>

<style>
  body { background:#f7f3ea; font-family:'Noto Sans KR',sans-serif; color:#2b2b2b; }

  /* 한문 원문 가독성 강화 */
  .han-text { font-family:'Noto Serif SC','Noto Serif KR',serif; letter-spacing:.06em; }
  .serif    { font-family:'Noto Serif KR',serif; }

  /* ===== 카드 뒤집기 3D 애니메이션 ===== */
  .flip-card { perspective:1600px; }
  .flip-inner {
    position:relative; width:100%; min-height:340px;
    transition:transform .6s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner { transform:rotateY(180deg); }
  .flip-face {
    position:absolute; inset:0; backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:1rem; overflow:hidden;
  }
  .flip-back { transform:rotateY(180deg); }
  /* 모바일에서 카드 높이 자동 (절대배치 해제) */
  @media (max-width:768px){ .flip-inner{ min-height:420px; } }

  /* 스크롤바 */
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#cbb89a; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* 토스트 등장 애니메이션 */
  @keyframes slideIn { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }
  .toast-in{ animation:slideIn .4s ease forwards; }

  /* 배지 획득 펄스 */
  @keyframes pop { 0%{transform:scale(.4);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .pop{ animation:pop .5s ease forwards; }

  /* 학습 완료 체크 효과 */
  @keyframes flash { 0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)} 100%{box-shadow:0 0 0 18px rgba(22,163,74,0)} }
  .flash-done{ animation:flash .7s ease; }

  /* 핵심 어휘 강조 */
  .kw-hi{ color:#b8860b; font-weight:700; border-bottom:2px dotted #b8860b; }

  /* 가리기 효과 */
  .blurred{ filter:blur(7px); user-select:none; transition:filter .2s; }

  /* 사이드바 슬라이드 (모바일) */
  #sidebar{ transition:transform .3s ease; }
  @media (max-width:1024px){
    #sidebar{ position:fixed; z-index:40; top:0; left:0; height:100%; transform:translateX(-100%); }
    #sidebar.open{ transform:translateX(0); }
  }

  .tab-active{ background:#1f3a5f; color:#fff; }
  [hidden]{ display:none !important; }
</style>
</head>

<body class="min-h-screen">

<!-- ================= 상단 헤더 ================= -->

      <div class="leading-tight">

<style>
  .tool-btn{ font-size:.8rem; padding:.45rem .75rem; border-radius:.6rem; background:#f1ece0; color:#2b2b2b; display:inline-flex; align-items:center; gap:.35rem; transition:.15s; }

<script>
/* ============================================================
   古文 학습 마스터 — 단일 HTML 프로토타입
   모든 상태는 LocalStorage에 저장됩니다.
   ============================================================ */

/* ---------- 0. 샘플 데이터 (작품 5개 / 문장 30개+) ---------- */
const SAMPLE_DATA = [
  /* ===== 1. 논어 ===== */
  {
    id:"work_001", title:"논어(論語)", author:"공자(孔子)와 제자들", source:"논어 학이편 등",
    period:"춘추전국", genre:"한문 산문", difficulty:"중급", exam_frequency:"상",
    sentences:[
      { id:"s001", original:"學而時習之 不亦說乎", reading:"학이시습지 불역열호",
        literal_translation:"배우고 때때로 그것을 익히면 또한 기쁘지 아니한가",
        natural_translation:"배운 것을 때때로 거듭 익히니 또한 기쁘지 않겠는가?",
        keywords:[
          {word:"學",reading:"학",meaning:"배우다",note:"동사로 쓰임"},
          {word:"時",reading:"시",meaning:"때때로",note:"부사적 용법"},

/* ---------- 1. 상태(LocalStorage) ---------- */
const LS_KEY = "gomun_master_state_v1";
const ADMIN_DEFAULT_PW = "admin123";

const defaultState = {
  profile:{ name:"학습자", createdAt:Date.now() },
  goal:{ sentences:5 },                 // 오늘의 목표(문장 수)
  progress:{},                          // sentId -> {status, reviewStage, lastStudied, due}
  completed:[],                         // 완료 문장 id
  bookmarks:[],                         // 북마크 id
  wrongNotes:[],                        // 오답 노트
  wordbooks:{ "기본 단어장":[] },        // 단어장 목록 -> [어휘객체]
  activeWordbook:"기본 단어장",
  quizLog:[],                           // {date, correct, grammarPoint, workId, ok}
  studyLog:{},                          // 'YYYY-MM-DD' -> 학습 문장 수
  badges:[],                            // 획득 배지 id
  streak:{ last:null, count:0 },        // 연속 학습
  admin:{ pw:ADMIN_DEFAULT_PW, apiProvider:"claude", apiKey:"" },
  customData:[],                        // 관리자가 추가한 작품
};

let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(defaultState);
    return Object.assign(structuredClone(defaultState), JSON.parse(raw));
  }catch(e){ console.warn("상태 로드 실패",e); return structuredClone(defaultState); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ console.warn("저장 실패",e);} }

/* 전체 데이터 = 샘플 + 관리자 추가 */
function allWorks(){ return [...SAMPLE_DATA, ...(state.customData||[])]; }
function allSentences(){ const a=[]; allWorks().forEach(w=>w.sentences.forEach(s=>a.push({...s, workId:w.id, work:w}))); return a; }
function findSentence(id){ return allSentences().find(s=>s.id===id); }
function findWork(id){ return allWorks().find(w=>w.id===id); }
const todayKey = ()=> new Date().toISOString().slice(0,10);

/* ---------- 2. 현재 학습 컨텍스트 ---------- */
let ctx = { workId:null, index:0, filterCat:"전체", hideTrans:false, hideOrig:false };

/* ============================================================
   3. 렌더링
   ============================================================ */
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

/* ----- 사이드바: 카테고리 & 작품 ----- */
const CATEGORIES = ["전체 작품","고전 산문","고전 시가","한문 산문","설화","수필","역사문","논설문","시험 빈출 작품","내가 저장한 작품","오답 복습","오늘의 복습"];

function renderSidebar(){
  // 카테고리
  const cn = $("#categoryNav"); cn.innerHTML="";
  CATEGORIES.forEach(cat=>{
    const b=document.createElement("button");
    b.className="w-full text-left px-3 py-1.5 rounded-lg hover:bg-paper flex items-center justify-between";
    b.innerHTML=`<span>${cat}</span>`;
    b.onclick=()=>{ ctx.filterCat=cat; openGridByCategory(cat); closeSidebarMobile(); };
    cn.appendChild(b);
  });
  // 작품 목록
  const wn=$("#workNav"); wn.innerHTML="";
  allWorks().forEach(w=>{
    const done=w.sentences.filter(s=>state.completed.includes(s.id)).length;
    const b=document.createElement("button");
    b.className="w-full text-left px-3 py-1.5 rounded-lg hover:bg-paper";
    b.innerHTML=`<div class="flex items-center justify-between">
        <span class="truncate">${w.title}</span>
        <span class="text-[10px] text-ink/40">${done}/${w.sentences.length}</span>
      </div>
      <div class="h-1 bg-black/5 rounded mt-1"><div class="h-1 bg-gold rounded" style="width:${w.sentences.length?done/w.sentences.length*100:0}%"></div></div>`;
    b.onclick=()=>{ loadWork(w.id); closeSidebarMobile(); };
    wn.appendChild(b);
  });
  // 갈래 필터 옵션
  const gf=$("#genreFilter");
  const genres=[...new Set(allWorks().map(w=>w.genre))];
  gf.innerHTML='<option value="">갈래 전체</option>'+genres.map(g=>`<option>${g}</option>`).join("");
}

/* ----- 작품 로드 ----- */
function loadWork(workId, index=0){
  ctx.workId=workId; ctx.index=index;
  showView("study");
  renderCard();
}

function currentSentence(){
  const w=findWork(ctx.workId); if(!w) return null;
  return {...w.sentences[ctx.index], workId:w.id, work:w};
}

/* ----- 메인 카드 렌더 ----- */
function renderCard(){
  const s=currentSentence();
  const w=findWork(ctx.workId);
  if(!s||!w){
    $("#currentWorkTitle").textContent="작품을 선택하세요";
    $("#currentWorkMeta").textContent="";
    return;
  }
  $("#currentWorkTitle").textContent=w.title;
  $("#currentWorkMeta").textContent=`${w.author} · ${w.period} · ${w.genre} · 난이도 ${w.difficulty} · 빈출 ${w.exam_frequency}`;
  $("#sentProgress").textContent=`${ctx.index+1} / ${w.sentences.length}`;

  // 앞면
  $("#fcWork").textContent=`${w.title} — ${w.author}`;
  $("#fcDiff").textContent=w.difficulty;
  $("#fcDiff").className="text-[11px] px-2 py-0.5 rounded-full "+diffColor(w.difficulty);
  const st=state.progress[s.id]?.status || (state.completed.includes(s.id)?"완료":"처음 학습");
  $("#fcStatus").textContent=st;
  $("#fcStatus").className="text-[11px] px-2 py-0.5 rounded-full "+(state.completed.includes(s.id)?"bg-correct/15 text-correct":"bg-black/10 text-ink/60");

  $("#fcOriginal").innerHTML = ctx.hideOrig ? `<span class="blurred">${s.original}</span>` : highlightKeywords(s.original, s.keywords);
  $("#fcReading").textContent=s.reading;

  // 앞면 핵심 어휘 칩
  $("#fcKeywords").innerHTML=s.keywords.slice(0,4).map(k=>
    `<span class="text-xs bg-gold/10 text-brown px-2 py-0.5 rounded-full">${k.word} ${k.meaning}</span>`).join("");

  // 뒷면
  const wrap = v => ctx.hideTrans ? `<span class="blurred">${v}</span>` : v;
  $("#fcNatural").innerHTML=wrap(s.natural_translation);
  $("#fcLiteral").innerHTML=wrap(s.literal_translation);
  $("#fcBackground").textContent=s.background;
  $("#fcKwList").innerHTML=s.keywords.map(k=>
    `<div class="text-xs"><b class="han-text text-brown">${k.word}</b> <span class="text-ink/50">(${k.reading})</span> — ${k.meaning}${k.note?` <span class="text-ink/40">· ${k.note}</span>`:""}</div>`).join("");
  $("#fcGrammar").innerHTML=s.grammar.map(g=>
    `<div class="text-xs"><b class="text-review">${g.point}</b>: ${g.explanation}${g.example?`<br/><span class="text-ink/50 han-text">예) ${g.example}</span>`:""}</div>`).join("");
  $("#fcStructure").innerHTML=structText(s.structure);

  // 카드 초기화(앞면)
  $("#flipCard").classList.remove("flipped");

  // 도구 버튼 상태
  $("#btnBookmark").classList.toggle("active", state.bookmarks.includes(s.id));
  $("#btnBookmark").innerHTML = state.bookmarks.includes(s.id)
    ? '<i class="fa-solid fa-bookmark"></i> 북마크됨' : '<i class="fa-regular fa-bookmark"></i> 북마크';
  $("#btnDone").classList.toggle("active", state.completed.includes(s.id));
  $("#btnHideTrans").classList.toggle("active", ctx.hideTrans);
  $("#btnHideOrig").classList.toggle("active", ctx.hideOrig);

  renderAnalysis(s);
}

function diffColor(d){ return d==="초급"?"bg-correct/15 text-correct":d==="중급"?"bg-gold/20 text-brown":"bg-wrong/15 text-wrong"; }

function highlightKeywords(text, keywords){
  let out=text;
  keywords.forEach(k=>{ out=out.split(k.word).join(`<span class="kw-hi">${k.word}</span>`); });
  return out;
}
function structText(st){
  if(!st) return "-";
  return `<span class="inline-block bg-navy/10 text-navy px-2 py-0.5 rounded mr-1 mb-1">주어: ${st.subject||"-"}</span>
          <span class="inline-block bg-brown/10 text-brown px-2 py-0.5 rounded mr-1 mb-1">서술어: ${st.predicate||"-"}</span>
          <span class="inline-block bg-gold/15 text-brown px-2 py-0.5 rounded mr-1 mb-1">목적어: ${st.object||"-"}</span>
          <span class="inline-block bg-black/5 px-2 py-0.5 rounded mb-1">생략: ${st.omitted||"-"}</span>`;
}

/* ----- 오른쪽 분석 패널 ----- */
function renderAnalysis(s){
  const p=$("#analysisPanel");
  p.innerHTML=`
    <div><p class="text-[11px] font-bold text-gold mb-1">어휘 분석</p>
      ${s.keywords.map(k=>`<div class="text-xs mb-0.5"><b class="han-text">${k.word}</b>(${k.reading}): ${k.meaning}</div>`).join("")}</div>
    <div><p class="text-[11px] font-bold text-review mb-1">문법·구문 분석</p>
      ${s.grammar.map(g=>`<div class="text-xs mb-0.5">• <b>${g.point}</b> — ${g.explanation}</div>`).join("")}</div>
    <div><p class="text-[11px] font-bold text-navy mb-1">문장 성분</p>
      <div class="text-xs">${structText(s.structure)}</div></div>
    <div><p class="text-[11px] font-bold text-brown mb-1">현대어 대응</p>
      <div class="text-xs">${ctx.hideTrans?'<span class="blurred">'+s.natural_translation+'</span>':s.natural_translation}</div></div>
    <div class="bg-gold/10 rounded-lg p-2"><p class="text-[11px] font-bold text-brown mb-1"><i class="fa-solid fa-star"></i> 시험 출제 포인트</p>
      <div class="text-xs">${s.exam_point}</div></div>
    <div><p class="text-[11px] font-bold text-ink/50 mb-1">유사 문장 비교</p>
      ${similarSentences(s).map(x=>`<div class="text-xs text-ink/60 mb-0.5 han-text cursor-pointer hover:text-navy" data-go="${x.id}">↪ ${x.original}</div>`).join("")||'<span class="text-xs text-ink/30">유사 문장 없음</span>'}</div>
  `;
  p.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{ const t=findSentence(el.dataset.go); if(t){ loadWork(t.workId, findWork(t.workId).sentences.findIndex(z=>z.id===t.id)); }});
}
function similarSentences(s){
  // 같은 문법 포인트를 공유하는 다른 문장
  const pts=s.grammar.map(g=>g.point);
  return allSentences().filter(x=>x.id!==s.id && x.grammar.some(g=>pts.includes(g.point))).slice(0,3);
}

/* ============================================================
   4. 학습 진도 / 완료 / 복습(간격 반복)
   ============================================================ */
const REVIEW_STAGES=["처음 학습","1차 복습","2차 복습","장기 기억","오답 집중 복습"];
const REVIEW_INTERVALS={ "처음 학습":1, "1차 복습":3, "2차 복습":7, "장기 기억":16, "오답 집중 복습":1 }; // 일 단위

function markCompleted(){
  const s=currentSentence(); if(!s) return;
  if(!state.completed.includes(s.id)) state.completed.push(s.id);
  // 진도 갱신 + 다음 복습 단계
  const cur=state.progress[s.id]||{ reviewStage:0 };
  const stage=Math.min((cur.reviewStage||0)+1, REVIEW_STAGES.length-2);
  state.progress[s.id]={ status:REVIEW_STAGES[stage], reviewStage:stage,
    lastStudied:Date.now(), due:Date.now()+REVIEW_INTERVALS[REVIEW_STAGES[stage]]*86400000 };
  // 학습 로그 + 목표
  state.studyLog[todayKey()]=(state.studyLog[todayKey()]||0)+1;
  updateStreak();
  saveState();
  // 시각적 피드백
  $("#flipCard").classList.add("flash-done");
  setTimeout(()=>$("#flipCard").classList.remove("flash-done"),700);
  toast("학습 완료! "+s.original, "correct");
  checkBadges();
  updateGoalChip();
  renderCard(); renderSidebar();
}

function updateStreak(){
  const t=todayKey();
  if(state.streak.last===t) return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streak.count = (state.streak.last===y) ? state.streak.count+1 : 1;
  state.streak.last=t;
}

/* 오늘의 복습 대상 */
function dueForReview(){
  const now=Date.now();
  return allSentences().filter(s=>{ const p=state.progress[s.id]; return p&&p.due&&p.due<=now; });
}

/* ----- 오늘의 목표 칩 ----- */
function updateGoalChip(){
  const done=state.studyLog[todayKey()]||0;
  $("#goalChipText").textContent=`목표 ${done}/${state.goal.sentences}`;
}

/* ============================================================
   5. 검색 / 필터 / 그리드
   ============================================================ */
function searchSentences(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  return allSentences().filter(s=>{
    const w=s.work;
    const hay=[w.title,w.author,w.period,w.genre,w.difficulty,s.original,s.reading,
      s.natural_translation,s.literal_translation,
      ...s.keywords.map(k=>k.word+k.meaning),
      ...s.grammar.map(g=>g.point+g.explanation)].join(" ").toLowerCase();
    return hay.includes(q);
  });
}

function openGridByCategory(cat){
  let list=[];
  const all=allSentences();
  switch(cat){
    case "전체 작품": list=all; break;
    case "고전 산문": list=all.filter(s=>s.work.genre==="고전 산문"); break;
    case "고전 시가": list=all.filter(s=>s.work.genre==="고전 시가"); break;
    case "한문 산문": list=all.filter(s=>s.work.genre==="한문 산문"); break;
    case "설화": list=all.filter(s=>s.work.genre==="설화"); break;
    case "수필": list=all.filter(s=>s.work.genre==="수필"); break;
    case "역사문": list=all.filter(s=>s.work.genre==="역사문"); break;
    case "논설문": list=all.filter(s=>s.work.genre==="논설문"); break;
    case "시험 빈출 작품": list=all.filter(s=>s.work.exam_frequency==="상"); break;
    case "내가 저장한 작품": list=all.filter(s=>state.bookmarks.includes(s.id)); break;
    case "오답 복습": list=all.filter(s=>state.wrongNotes.some(wn=>wn.sentId===s.id)); break;
    case "오늘의 복습": list=dueForReview(); break;
    default: list=all;
  }
  renderGrid(list, cat);
}

function applyHeaderFilters(){
  const g=$("#genreFilter").value, d=$("#diffFilter").value;
  let list=allSentences();
  if(g) list=list.filter(s=>s.work.genre===g);
  if(d) list=list.filter(s=>s.work.difficulty===d);
  renderGrid(list, `필터 결과 (${g||"전체"} / ${d||"전체"})`);
}

function renderGrid(list, title){
  showView("grid");
  $("#gridTitle").textContent=`${title} · ${list.length}개`;
  const g=$("#gridResults");
  if(!list.length){ g.innerHTML='<p class="text-ink/40 col-span-full text-center py-10">결과가 없습니다.</p>'; return; }
  g.innerHTML="";
  list.forEach(s=>{
    const w=s.work;
    const card=document.createElement("div");
    card.className="bg-white rounded-xl shadow p-4 cursor-pointer hover:shadow-lg transition border border-transparent hover:border-gold/40";
    card.innerHTML=`
      <div class="flex justify-between items-start mb-2">
        <span class="text-xs font-bold text-brown">${w.title}</span>
        <span class="text-[10px] px-2 py-0.5 rounded-full ${diffColor(w.difficulty)}">${w.difficulty}</span>
      </div>
      <p class="han-text text-xl mb-1">${s.original}</p>
      <p class="text-xs text-navy/60 serif mb-2">${s.reading}</p>
      <p class="text-xs text-ink/60 line-clamp-2">${s.natural_translation}</p>`;
    card.onclick=()=>loadWork(w.id, w.sentences.findIndex(z=>z.id===s.id));
    g.appendChild(card);
  });
}

/* ============================================================
   6. 퀴즈
   ============================================================ */
let quizQueue=[], quizPos=0, quizScore=0;

function startQuiz(sentences){
  // 문장들에서 퀴즈 수집
  quizQueue=[];
  sentences.forEach(s=>(s.quiz||[]).forEach(q=>quizQueue.push({...q, sent:s})));
  if(!quizQueue.length){ toast("이 범위에 퀴즈가 없습니다.","review"); return; }
  // 섞기
  quizQueue.sort(()=>Math.random()-0.5);
  quizPos=0; quizScore=0;
  openModal("#quizModal");
  renderQuiz();
}

function renderQuiz(){
  const body=$("#quizBody");
  if(quizPos>=quizQueue.length){
    body.innerHTML=`<div class="text-center py-6">
      <p class="text-5xl mb-3">${quizScore===quizQueue.length?"🏆":"📚"}</p>
      <p class="text-xl font-black text-navy mb-1">퀴즈 완료!</p>
      <p class="text-ink/60 mb-4">${quizQueue.length}문제 중 <b class="text-correct">${quizScore}</b>개 정답</p>
      <button class="closeModal bg-navy text-white px-5 py-2 rounded-lg">닫기</button></div>`;
    bindCloseButtons();
    checkBadges();
    return;
  }
  const q=quizQueue[quizPos];
  body.innerHTML=`
    <div class="mb-3 flex justify-between text-xs text-ink/50">
      <span>${q.type}</span><span>${quizPos+1} / ${quizQueue.length}</span></div>
    <p class="font-bold mb-1 text-brown text-sm">${q.sent.work.title}</p>
    <p class="han-text text-lg mb-3">${q.sent.original}</p>
    <p class="font-semibold mb-3">${q.q}</p>
    <div id="quizOpts" class="space-y-2"></div>
    <div id="quizFeedback" class="mt-3"></div>`;
  const opts=$("#quizOpts");
  q.options.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="w-full text-left px-4 py-2.5 rounded-lg border border-black/10 hover:bg-paper transition";
    b.innerHTML=`<span class="font-bold text-navy mr-2">${i+1}.</span>${opt}`;
    b.onclick=()=>answerQuiz(i,q,b);
    opts.appendChild(b);
  });
}

function answerQuiz(choice,q,btn){
  const ok=choice===q.answer;
  $$("#quizOpts button").forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer) b.classList.add("bg-correct/15","border-correct","text-correct","font-bold");
    if(i===choice && !ok) b.classList.add("bg-wrong/15","border-wrong","text-wrong");
  });
  // 로그
  state.quizLog.push({ date:todayKey(), ok, grammarPoint:(q.sent.grammar[0]?.point)||"기타", workId:q.sent.workId });
  if(ok){ quizScore++; }
  else { addWrongNote(q,choice); }
  saveState();

  $("#quizFeedback").innerHTML=`
    <div class="rounded-lg p-3 ${ok?'bg-correct/10 text-correct':'bg-wrong/10 text-wrong'}">
      <p class="font-bold mb-1">${ok?'<i class="fa-solid fa-circle-check"></i> 정답입니다!':'<i class="fa-solid fa-circle-xmark"></i> 오답입니다'}</p>
      <p class="text-sm text-ink/70">${ok?'':'정답: '+(q.answer+1)+'번. '}${q.explain||""}</p>
      ${ok?'':'<p class="text-xs text-review mt-1"><i class="fa-solid fa-rotate"></i> 오답 노트에 자동 저장되었습니다.</p>'}
    </div>
    <button id="quizNext" class="w-full mt-3 bg-navy text-white py-2 rounded-lg font-bold">${quizPos+1>=quizQueue.length?'결과 보기':'다음 문제'}</button>`;
  $("#quizNext").onclick=()=>{ quizPos++; renderQuiz(); };
}

function addWrongNote(q,choice){
  state.wrongNotes.unshift({
    id:"wn_"+Date.now()+Math.random().toString(36).slice(2,6),
    sentId:q.sent.id, workTitle:q.sent.work.title, original:q.sent.original,
    question:q.q, options:q.options, myAnswer:choice, answer:q.answer,
    explain:q.explain||"", keywords:q.sent.keywords, date:todayKey()
  });
  // 복습 예정에 추가(오답 집중 복습)
  state.progress[q.sent.id]={ status:"오답 집중 복습", reviewStage:4,
    lastStudied:Date.now(), due:Date.now()+REVIEW_INTERVALS["오답 집중 복습"]*86400000 };
}

function addCurrentKeywordsToWordbook(){
  const s=currentSentence(); if(!s) return;
  const wb=state.wordbooks[state.activeWordbook];
  let added=0;
  s.keywords.forEach(k=>{
    if(!wb.some(x=>x.word===k.word && x.example===s.original)){
      wb.push({ word:k.word, reading:k.reading, meaning:k.meaning, hanja:k.word,
        example:s.original, natural:s.natural_translation, work:s.work.title, memo:"", reviewStatus:"처음 학습" });
      added++;
    }
  });
  saveState();
  toast(`${added}개 어휘를 '${state.activeWordbook}'에 추가했습니다.`, "gold");
  checkBadges();
}

function renderWordbook(){
  const sel=$("#wbListSelect");
  sel.innerHTML=Object.keys(state.wordbooks).map(n=>`<option ${n===state.activeWordbook?"selected":""}>${n}</option>`).join("");
  sel.onchange=()=>{ state.activeWordbook=sel.value; saveState(); renderWordbook(); };
  const grid=$("#wordbookGrid");
  const wb=state.wordbooks[state.activeWordbook]||[];
  if(!wb.length){ grid.innerHTML='<p class="text-ink/40 col-span-full text-center py-10">단어장이 비어 있습니다. 학습 중 \"단어장\" 버튼을 눌러 추가하세요.</p>'; return; }
  grid.innerHTML="";
  wb.forEach((k,i)=>{
    const d=document.createElement("div");
    d.className="bg-white rounded-xl shadow p-4";
    d.innerHTML=`
      <div class="flex justify-between items-start">
        <div><span class="han-text text-2xl text-brown">${k.word}</span>

  });

  const gmap={};

  const gKeys=Object.keys(gmap).slice(0,8);
  drawChart("chartGrammar","bar",{labels:gKeys.length?gKeys:["데이터 없음"],
    datasets:[{label:"정답률(%)",data:gKeys.length?gKeys.map(k=>Math.round(gmap[k].ok/gmap[k].n*100)):[0],backgroundColor:"#7c3aed"}]},{indexAxis:"y"});

  // 오답률 높은 작품
  const wmap={};
  state.quizLog.forEach(q=>{ wmap[q.workId]=wmap[q.workId]||{wrong:0,n:0}; wmap[q.workId].n++; if(!q.ok)wmap[q.workId].wrong++; });
  const wKeys=Object.keys(wmap);
  drawChart("chartWrong","doughnut",{labels:wKeys.length?wKeys.map(id=>(findWork(id)?.title||id).replace(/\(.*\)/,"")):["데이터 없음"],
    datasets:[{data:wKeys.length?wKeys.map(id=>wmap[id].wrong):[1],backgroundColor:["#dc2626","#b8860b","#1f3a5f","#7c3aed","#6b4f3a"]}]});
}
function drawChart(id,type,data,extra={}){
  const el=document.getElementById(id); if(!el) return;
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart(el,{type,data,options:{responsive:true,plugins:{legend:{display:type!=="bar"||false}},...extra}});
}

/* ============================================================
   11. AI 해설 생성 (서버 프록시 권장 안내 포함)
   ============================================================ */
async function generateAI(){
  const s=currentSentence(); if(!s){ toast("문장을 먼저 선택하세요.","wrong"); return; }
  const key=state.admin.apiKey;
  const provider=state.admin.apiProvider;
  // 키가 없으면 템플릿 해설(데모) 생성
  if(!key){
    showAIResult(localAIExplanation(s), true);
    return;
  }
  toast("AI 해설 생성 중…","navy");
  try{
    const prompt=aiPrompt(s);
    let text="";
    if(provider==="claude"){
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-3-5-sonnet-20241022",max_tokens:1500,messages:[{role:"user",content:prompt}]})
      });
      const j=await r.json(); text=j.content?.[0]?.text || JSON.stringify(j);
    }else{
      const r=await fetch("https://api.openai.com/v1/chat/completions",{
        method:"POST",
        headers:{"content-type":"application/json","authorization":"Bearer "+key},
        body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"user",content:prompt}]})
      });
      const j=await r.json(); text=j.choices?.[0]?.message?.content || JSON.stringify(j);
    }
    showAIResult(text.replace(/\n/g,"<br/>"), false);
  }catch(e){
    showAIResult("API 호출 실패: "+e.message+"<br/><br/>아래는 내장 해설입니다.<hr/>"+localAIExplanation(s), true);
  }
}
function aiPrompt(s){
  return `다음 고문 문장을 학습자용으로 해설해줘. 형식: 1.원문 2.끊어읽기 3.직역 4.현대어풀이 5.핵심어휘 6.문법설명 7.문장구조 8.배경지식 9.시험출제포인트 10.학습자용 쉬운 설명 11.심화 학습 질문\n\n원문: ${s.original}\n독음: ${s.reading}`;
}
function localAIExplanation(s){
  return `<b>1. 원문</b><br/><span class="han-text">${s.original}</span><br/>
  <b>2. 끊어 읽기</b><br/>${s.reading}<br/>
  <b>3. 직역</b><br/>${s.literal_translation}<br/>
  <b>4. 자연스러운 현대어 풀이</b><br/>${s.natural_translation}<br/>
  <b>5. 핵심 어휘</b><br/>${s.keywords.map(k=>`${k.word}(${k.reading}): ${k.meaning}`).join("<br/>")}<br/>
  <b>6. 문법 설명</b><br/>${s.grammar.map(g=>`${g.point}: ${g.explanation}`).join("<br/>")}<br/>
  <b>7. 문장 구조</b><br/>주어 ${s.structure.subject} / 서술어 ${s.structure.predicate} / 목적어 ${s.structure.object}<br/>
  <b>8. 배경 지식</b><br/>${s.background}<br/>
  <b>9. 시험 출제 포인트</b><br/>${s.exam_point}<br/>
  <b>10. 쉬운 설명</b><br/>이 문장은 "${s.natural_translation}"라는 뜻으로, 핵심 글자만 알면 쉽게 이해할 수 있어요.<br/>
  <b>11. 심화 질문</b><br/>이 문장의 문법 요소(${s.grammar[0]?.point})가 쓰인 다른 예문을 찾아볼까요?`;
}
function showAIResult(html, isLocal){
  openModal("#quizModal");
  $("#quizBody").innerHTML=`
    <div class="mb-2 text-xs ${isLocal?'text-brown':'text-correct'}">
      <i class="fa-solid ${isLocal?'fa-circle-info':'fa-robot'}"></i>
      ${isLocal?'API 키 미설정 — 내장(데모) 해설을 표시합니다. 관리자 화면에서 API 키를 입력하세요.':'AI 생성 해설'}
    </div>
    <div class="text-sm leading-relaxed space-y-1 bg-paper rounded-lg p-3">${html}</div>
    <p class="text-[10px] text-ink/40 mt-3"><i class="fa-solid fa-shield-halved"></i> 실제 배포 시 API 키는 서버 프록시로 처리해 클라이언트에 노출하지 마세요.</p>
    <button class="closeModal w-full mt-3 bg-navy text-white py-2 rounded-lg">닫기</button>`;
  bindCloseButtons();
}

        </select>
        <input id="adKey" type="password" class="border rounded px-2 py-1 w-full mb-2" placeholder="API 키" value="${state.admin.apiKey||""}">
        <p class="text-[10px] text-ink/50 mb-2">localStorage에 저장됩니다. 실제 서비스에서는 서버 환경변수+프록시 사용을 권장합니다.</p>
        <button id="adSaveKey" class="bg-navy text-white px-3 py-1.5 rounded text-xs">키 저장</button>
      </div>

      <div class="border rounded-lg p-3">
        <p class="font-bold mb-2"><i class="fa-solid fa-plus"></i> 작품/문장 추가 (JSON)</p>
        <textarea id="adWorkJson" class="border rounded w-full h-24 text-xs p-2 han-text" placeholder='{"id":"work_x","title":"새 작품",...,"sentences":[...]}'></textarea>
        <button id="adAddWork" class="bg-gold text-white px-3 py-1.5 rounded text-xs mt-1">작품 추가</button>
      </div>

      <div class="border rounded-lg p-3">
        <p class="font-bold mb-2"><i class="fa-solid fa-lock"></i> 관리자 비밀번호 변경</p>
        <input id="adNewPw" type="text" class="border rounded px-2 py-1 w-full mb-2" placeholder="새 비밀번호">
        <button id="adChangePw" class="bg-navy text-white px-3 py-1.5 rounded text-xs">변경</button>
      </div>

      <div class="border rounded-lg p-3">
        <p class="font-bold mb-2"><i class="fa-solid fa-chart-simple"></i> 학습 현황(현재 학습자)</p>
        <p class="text-xs">학습자: ${state.profile.name} · 완료 ${state.completed.length}문장 · 퀴즈 정답 ${qOk}/${state.quizLog.length} · 연속 ${state.streak.count}일</p>
      </div>

      <div class="border rounded-lg p-3 flex flex-wrap gap-2">
        <button id="adExport" class="bg-navy text-white px-3 py-1.5 rounded text-xs"><i class="fa-solid fa-download"></i> JSON 내보내기</button>
        <label class="bg-brown text-white px-3 py-1.5 rounded text-xs cursor-pointer"><i class="fa-solid fa-upload"></i> JSON 가져오기
          <input id="adImport" type="file" accept=".json" class="hidden"></label>
        <button id="adReset" class="bg-wrong text-white px-3 py-1.5 rounded text-xs"><i class="fa-solid fa-trash"></i> LocalStorage 초기화</button>
      </div>
    </div>`;
  // 핸들러
  $("#adSaveKey").onclick=()=>{ state.admin.apiProvider=$("#adProvider").value; state.admin.apiKey=$("#adKey").value.trim(); saveState(); toast("API 키 저장됨","correct"); };
  $("#adAddWork").onclick=()=>{
    try{ const w=JSON.parse($("#adWorkJson").value); if(!w.id||!w.sentences) throw new Error("id/sentences 필요");
      state.customData.push(w); saveState(); renderSidebar(); toast("작품 추가됨: "+w.title,"correct");
    }catch(e){ toast("JSON 오류: "+e.message,"wrong"); }
  };
  $("#adChangePw").onclick=()=>{ const v=$("#adNewPw").value.trim(); if(v){ state.admin.pw=v; saveState(); toast("비밀번호 변경됨","correct"); } };
  $("#adExport").onclick=exportData;
  $("#adImport").onchange=importData;
  $("#adReset").onclick=()=>{ if(confirm("모든 학습 데이터를 삭제하고 초기화할까요?")){ localStorage.removeItem(LS_KEY); state=structuredClone(defaultState); saveState(); location.reload(); } };
}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="gomun-master-backup.json"; a.click();
  toast("데이터를 내보냈습니다.","correct");
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); state=Object.assign(structuredClone(defaultState),d); saveState(); toast("가져오기 완료","correct"); location.reload(); }catch(err){ toast("가져오기 실패: "+err.message,"wrong"); } };
  r.readAsText(f);
}

/* ============================================================
   13. 뷰 전환 / 모달 / 토스트
   ============================================================ */
function showView(name){
  ["study","grid","dashboard","wordbook","wrongnote","badges"].forEach(v=>{
    const el=document.getElementById("view-"+v); if(el) el.hidden = (v!==name);
  });
  if(name==="dashboard") renderDashboard();
  if(name==="wordbook") renderWordbook();
  if(name==="wrongnote") renderWrongNotes();
  if(name==="badges"){ renderBadges(); checkBadges(); }
}
function openModal(sel){ const m=$(sel); m.classList.remove("hidden"); m.classList.add("flex"); }
function closeModal(){ $$(".fixed.z-50").forEach(m=>{ m.classList.add("hidden"); m.classList.remove("flex"); }); }
function bindCloseButtons(){ $$(".closeModal").forEach(b=>b.onclick=closeModal); }

function toast(msg,color="navy",badge=false){
  const map={navy:"bg-navy",correct:"bg-correct",wrong:"bg-wrong",gold:"bg-gold text-ink",review:"bg-review"};
  const t=document.createElement("div");
  t.className=`toast-in ${map[color]||"bg-navy"} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm max-w-xs ${badge?"pop font-bold":""}`;
  t.innerHTML=msg;
  $("#toastWrap").appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .4s"; t.style.opacity="0"; setTimeout(()=>t.remove(),400); }, badge?3500:2200);
}

/* 모바일 사이드바 */
function closeSidebarMobile(){ $("#sidebar").classList.remove("open"); $("#sidebarBackdrop").classList.add("hidden"); }
function openSidebarMobile(){ $("#sidebar").classList.add("open"); $("#sidebarBackdrop").classList.remove("hidden"); }

/* ============================================================
   14. 이벤트 바인딩
   ============================================================ */
function bindEvents(){
  // 카드 뒤집기
  $("#flipCard").onclick=(e)=>{ if(e.target.closest("button")) return; $("#flipCard").classList.toggle("flipped"); };
  $("#fcQuizBtn").onclick=(e)=>{ e.stopPropagation(); const s=currentSentence(); if(s) startQuiz([s]); };

  // 하단 도구
  $("#btnPrev").onclick=()=>{ const w=findWork(ctx.workId); if(!w)return; ctx.index=(ctx.index-1+w.sentences.length)%w.sentences.length; renderCard(); };
  $("#btnNext").onclick=()=>{ const w=findWork(ctx.workId); if(!w)return; ctx.index=(ctx.index+1)%w.sentences.length; renderCard(); };
  $("#btnBookmark").onclick=()=>{ const s=currentSentence(); if(!s)return; const i=state.bookmarks.indexOf(s.id);
    if(i>=0) state.bookmarks.splice(i,1); else state.bookmarks.push(s.id); saveState(); renderCard(); };
  $("#btnAddWord").onclick=addCurrentKeywordsToWordbook;
  $("#btnAddWord").title="현재 문장의 핵심 어휘를 단어장에 추가";
  $("#btnHideTrans").onclick=()=>{ ctx.hideTrans=!ctx.hideTrans; renderCard(); };
  $("#btnHideOrig").onclick=()=>{ ctx.hideOrig=!ctx.hideOrig; renderCard(); };
  $("#btnQuiz").onclick=()=>{ const w=findWork(ctx.workId); if(w) startQuiz(w.sentences.map(s=>({...s,work:w,workId:w.id}))); else toast("작품을 선택하세요.","wrong"); };
  $("#btnReview").onclick=()=>{ const due=dueForReview(); if(due.length) startQuiz(due); else toast("복습 예정 문장이 없습니다.","review"); };
  $("#btnDone").onclick=markCompleted;
  $("#btnAI").onclick=generateAI;

  // 헤더
  $("#searchInput").addEventListener("input",e=>{ const q=e.target.value; if(q.trim().length>=1) renderGrid(searchSentences(q), `'${q}' 검색`); else if(!q) showView("study"); });
  $("#genreFilter").onchange=applyHeaderFilters;
  $("#diffFilter").onchange=applyHeaderFilters;
  $("#goalChip").onclick=()=>{ const v=prompt("오늘의 목표(학습할 문장 수)를 입력하세요.", state.goal.sentences); if(v&&+v>0){ state.goal.sentences=+v; saveState(); updateGoalChip(); toast("오늘의 목표를 "+v+"문장으로 설정했습니다.","gold"); } };
  $("#btnLearner").onclick=()=>{ const v=prompt("학습자 이름을 입력하세요.", state.profile.name); if(v){ state.profile.name=v; saveState(); $("#learnerName").textContent=v; toast("환영합니다, "+v+"님!","navy"); } };
  $("#btnAdmin").onclick=openAdmin;

  // 사이드바 nav (대시보드 등)
  $$(".navItem").forEach(b=>b.onclick=()=>{ showView(b.dataset.view); closeSidebarMobile(); });

  // 그리드 뒤로
  $("#gridBack").onclick=()=>showView("study");

  // 단어장 새 목록
  $("#wbNewList").onclick=()=>{ const n=prompt("새 단어장 이름 (예: 시험 빈출 어휘, 한문 허사)"); if(n&&!state.wordbooks[n]){ state.wordbooks[n]=[]; state.activeWordbook=n; saveState(); renderWordbook(); } };

  // 모달 닫기
  bindCloseButtons();
  $$("#quizModal,#adminModal").forEach(m=>m.onclick=e=>{ if(e.target===m) closeModal(); });

  // 모바일 사이드바
  $("#btnSidebar").onclick=openSidebarMobile;
  $("#closeSidebar").onclick=closeSidebarMobile;
  $("#sidebarBackdrop").onclick=closeSidebarMobile;

  // 키보드 단축키
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
    if(e.key==="ArrowLeft") $("#btnPrev").click();
    if(e.key==="ArrowRight") $("#btnNext").click();
    if(e.key===" "){ e.preventDefault(); $("#flipCard").classList.toggle("flipped"); }
  });
}

/* ============================================================
   15. 초기화
   ============================================================ */
function init(){
  renderSidebar();
  bindEvents();
  $("#learnerName").textContent=state.profile.name;
  updateGoalChip();
  // 첫 작품 자동 로드(빈 화면 방지)
  loadWork(SAMPLE_DATA[0].id, 0);
  checkBadges();
  toast("古文 학습 마스터에 오신 것을 환영합니다! 카드를 클릭해 해석을 확인하세요.","navy");
}
init();
</script>
</body>
</html>
