<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사립대학교 권역별 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --card: #1c2128; --border: #30363d;
  --accent: #6c5ce7; --accent2: #a29bfe; --text: #e6edf3; --text-dim: #8b949e;
  --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }


/* Filter bar */
.filter-bar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 5px 1rem; display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap;
}
.filter-label { font-size: 0.6rem; color: var(--text-dim); font-weight: 700; margin-right: 2px; }
.filter-chip {
  padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border);
  background: none; color: var(--text-dim); font-size: 0.6rem; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent2); }
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar list */
.sidebar {
  width: 220px; min-width: 180px; background: var(--bg2); border-right: 1px solid var(--border);
  overflow-y: auto; flex-shrink: 0;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.region-group { border-bottom: 1px solid var(--border); }
.region-header {
  padding: 6px 10px; background: var(--bg); display: flex; align-items: center;
  justify-content: space-between; cursor: pointer; position: sticky; top: 0; z-index: 1;
}
.region-header:hover { background: var(--card); }
.region-name { font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.region-badge {
  font-size: 0.55rem; padding: 1px 5px; border-radius: 8px; font-weight: 600;
}
.region-toggle { color: var(--text-dim); font-size: 0.55rem; }
.univ-list { display: none; }
.univ-list.open { display: block; }
.sub-list { display: none; }
.sub-list.open { display: block; }
.sub-header:hover { background: var(--card); }
.univ-item {
  padding: 3px 8px 3px 20px; font-size: 0.62rem; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; gap: 5px; border-left: 3px solid transparent;
  transition: all .1s;
}
.univ-item:hover { background: var(--card); color: var(--text); border-left-color: var(--accent); }
.univ-item.selected { background: var(--card); color: var(--accent2); border-left-color: var(--accent); font-weight: 600; }
.est-badge {
  font-size: 0.5rem; padding: 1px 3px; border-radius: 3px; flex-shrink: 0;
}
.est-사립 { background: rgba(108,92,231,.2); color: #a29bfe; }
.est-국립, .est-국립대법인 { background: rgba(63,185,80,.2); color: #3fb950; }
.est-공립 { background: rgba(88,166,255,.2); color: #58a6ff; }
.est-특별법법인 { background: rgba(248,180,0,.2); color: #f8b400; }

/* Map */
#mapContainer { display: flex; flex-direction: column; }
#map { flex: 1; min-height: 0; width: 100%; }

/* Leaflet popup */
.lf-popup { font-family: 'Noto Sans KR', sans-serif; min-width: 190px; max-width: 240px; }
.lf-name { font-weight: 800; font-size: .88rem; color: #111; line-height: 1.3; margin-bottom: 4px; }
.lf-badge {
  display: inline-block; font-size: .62rem; font-weight: 700; padding: 1px 6px;
  border-radius: 8px; margin-bottom: 6px; color: #fff;
}
.lf-table { width: 100%; border-collapse: collapse; margin: 4px 0 6px; font-size: .73rem; }
.lf-table tr { border-bottom: 1px solid #f0f0f0; }
.lf-table td { padding: 3px; color: #222; vertical-align: middle; }
.lf-label { color: #666; font-weight: 700; white-space: nowrap; padding-right: 8px; width: 52px; }
.lf-links { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.lf-links a {
  font-size: .67rem; color: #fff; background: #6c5ce7; text-decoration: none;
  padding: 3px 8px; border-radius: 5px; font-weight: 700; white-space: nowrap;
}
.lf-links a:hover { background: #5a4ed1; }
.lf-links a.sec { background: #00b894; }
.lf-links a.sec:hover { background: #00997a; }

/* Search overlay */
.map-search {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 100;
  background: white; border-radius: 24px; padding: 8px 16px; display: flex; gap: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.3); width: 320px;
}
.map-search input { border: none; outline: none; flex: 1; font-size: .88rem; }
.map-search button { background: none; border: none; cursor: pointer; color: #6c5ce7; font-size: 1rem; }
</style>
</head>

부대학교":350,"중앙대학교":1198,"중원대학교":123,"진주교육대학교":68,"차의과학대학교":502,"창신대학교":73,"청운대학교":154,"청주교육대학교":70,"청주대학교":441,"초당대학교":88,"총신대학교":104,"추계예술대학교":47,"춘천교육대학교":75,"충남대학교":1059,"충북대학교":800,"칼빈대학교":80,"평택대학교":120,"포항공과대학교":284,"한경국립대학교":256,"한국공학대학교":262,"한국과학기술원":716,"한국교원대학교":209,"한국기술교육대학교":184,"한국성서대학교":41,"한국에너지공과대학교":49,"한국외국어대학교":612,"한국체육대학교":118,"한국침례신학대학교":55,"한국항공대학교":168,"한남대학교":385,"한동대학교":146,"한라대학교":109,"한림대학교":705,"한서대학교":229,"한성대학교":282,"한세대학교":100,"한신대학교":175,"한양대학교(ERICA)_분교":415,"한양대학교":1141,"한일장신대학교":37,"협성대학교":128,"호남대학교":243,"호남신학대학교":32,"호서대학교":432,"호원대학교":141,"홍익대학교":725,"화성의과학대학교":31};

// Gwon color map
const GWON_COLORS = {
  '수도권': '#6c5ce7',
  '충청권': '#f39c12',
  '영남권': '#e74c3c',
  '호남권': '#27ae60',
  '강원권': '#2980b9',
  '제주권': '#16a085',
};
const REGION_GWON = {
  '서울':'수도권','경기':'수도권','인천':'수도권',
  '대전':'충청권','충남':'충청권','충북':'충청권','세종':'충청권',
  '부산':'영남권','경남':'영남권','대구':'영남권','경북':'영남권','울산':'영남권',
  '광주':'호남권','전남':'호남권','전북':'호남권',
  '강원':'강원권',
  '제주':'제주권',
};

// State
let activeGwon = 'all';
let activeEst = 'all';
let map, markers = [];

function getFiltered() {
  return UNIVERSITIES.filter(u => {
    if (activeGwon !== 'all' && u.gwon !== activeGwon) return false;
    if (activeEst !== 'all') {
      if (activeEst === '국립' && !['국립','국립대법인','특별법법인'].includes(u.est)) return false;
      if (activeEst === '사립' && u.est !== '사립') return false;
    }
    return true;
  });
}

// ── SIDEBAR ──
function buildSidebar() {
  const filtered = getFiltered();
  const sidebar = document.getElementById('sidebar');

  // Group by gwon then region
  const gwonMap = {};
  filtered.forEach(u => {
    if (!gwonMap[u.gwon]) gwonMap[u.gwon] = {};
    if (!gwonMap[u.gwon][u.region]) gwonMap[u.gwon][u.region] = [];
    gwonMap[u.gwon][u.region].push(u);
  });

  const gwonOrder = ['수도권','충청권','영남권','호남권','강원권','제주권'];
  sidebar.innerHTML = '';
  gwonOrder.forEach(gwon => {
    if (!gwonMap[gwon]) return;
    const color = GWON_COLORS[gwon];
    const totalCount = Object.values(gwonMap[gwon]).flat().length;
    const gwonEl = document.createElement('div');
    gwonEl.className = 'region-group';
    gwonEl.innerHTML = `
      <div class="region-header" onclick="toggleGroup(this)">
        <div class="region-name">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color}"></span>
          ${gwon}
          <span class="region-badge" style="background:${color}22;color:${color}">${totalCount}</span>
        </div>
        <span class="region-toggle">▾</span>
      </div>
      <div class="univ-list open">
        ${Object.entries(gwonMap[gwon]).sort().map(([region, unis]) => `
          <div class="sub-header" onclick="toggleSub(this)" style="padding:6px 16px 4px 20px;font-size:.72rem;color:${color};font-weight:700;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
            <span>${region} (${unis.length})</span>
            <span class="sub-toggle" style="font-size:.6rem;color:${color};opacity:.7;">▾</span>
          </div>
          <div class="sub-list open">
            ${unis.map(u => `
              <div class="univ-item" data-name="${u.name}" onclick="focusUniv('${u.name}')">
                <span class="est-badge est-${u.est}">${u.est[0]}</span>
                ${u.name.replace('_분교','<span style="color:#888;font-size:.65rem"> (분교)</span>')}
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    `;
    sidebar.appendChild(gwonEl);
  });

}

function toggleGroup(el) {
  const list = el.nextElementSibling;
  list.classList.toggle('open');
  el.querySelector('.region-toggle').textContent = list.classList.contains('open') ? '▾' : '▸';
}
function toggleSub(el) {
  const list = el.nextElementSibling;
  list.classList.toggle('open');
  el.querySelector('.sub-toggle').textContent = list.classList.contains('open') ? '▾' : '▸';
}

// ── FILTERS ──
function filterRegion(gwon, btn) {
  activeGwon = gwon;
  document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildSidebar();
  if (map) updateMarkers();
}
function filterEst(est, btn) {
  activeEst = est;
  document.querySelectorAll('[data-est]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildSidebar();
  if (map) updateMarkers();
}

// ── MAPS (Leaflet + OpenStreetMap) ──
function initLeafletMap() {
  map = L.map('map', { center: [36.5, 127.8], zoom: 7, zoomControl: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  updateMarkers();
}

function makeUnivIcon(color, isNational, name) {
  const label = name.replace('_분교','').replace('(분교)','').replace('대학교','대').replace('대학','대');
  const icon = isNational ? '🏛' : '🎓';
  return L.divIcon({
    html: `<div style="background:${color};color:#fff;padding:2px 5px;border-radius:8px;font-size:9px;font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,0.6);font-family:'Noto Sans KR',sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.4)">${icon} ${label}</div>`,
    className: '', iconAnchor: [0, 12],
  });
}

function updateMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  getFiltered().forEach(u => {
    const color = GWON_COLORS[u.gwon] || '#888';
    const isNational = u.est === '국립' || u.est === '국립대법인' || u.est === '특별법법인';
    const cleanName = u.name.replace('_분교','').replace('(분교)','');
    const profText = PROF_DATA[u.name] ? `${PROF_DATA[u.name].toLocaleString()}명` : '-';
    const searchUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(cleanName)}`;
    const alrimiUrl = `https://www.academyinfo.go.kr/popup/univInfoPopup.do?univId=${encodeURIComponent(cleanName)}`;
    const telUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(cleanName+' 대표전화')}`;
    const stuUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(cleanName+' 재학생수')}`;

    const marker = L.marker([u.lat, u.lng], { icon: makeUnivIcon(color, isNational, u.name) });
    marker.bindPopup(`
      <div class="lf-popup">
        <div class="lf-name">${cleanName}</div>
        <span class="lf-badge" style="background:${color}">${u.gwon}</span>
        <table class="lf-table">
          <tr><td class="lf-label">설립</td><td>${isNational ? '🏛 국립' : '🏢 사립'}</td></tr>
          <tr><td class="lf-label">소재지</td><td>📍 ${u.region}</td></tr>
          <tr><td class="lf-label">교수수</td><td>👨‍🏫 ${profText}</td></tr>
          <tr><td class="lf-label">학생수</td><td><a href="${stuUrl}" target="_blank" style="color:#6c5ce7;font-weight:700">🔍 검색 ↗</a></td></tr>
          <tr><td class="lf-label">대표전화</td><td><a href="${telUrl}" target="_blank" style="color:#00b894;font-weight:700">📞 검색 ↗</a></td></tr>
        </table>
        <div class="lf-links">
          <a href="${searchUrl}" target="_blank">🔍 검색</a>
          <a href="${alrimiUrl}" target="_blank" class="sec">📊 대학알리미</a>
        </div>
      </div>
    `, { maxWidth: 260 });
    marker.on('click', () => {
      document.querySelectorAll('.univ-item').forEach(el => el.classList.remove('selected'));
      const el = document.querySelector(`.univ-item[data-name="${u.name}"]`);
      if (el) { el.classList.add('selected'); el.scrollIntoView({block:'nearest'}); }
    });
    marker.univName = u.name;
    marker.addTo(map);
    markers.push(marker);
  });
}

function focusUniv(name) {
  const u = UNIVERSITIES.find(x => x.name === name);
  if (!u || !map) return;
  map.setView([u.lat, u.lng], 13);
  const marker = markers.find(m => m.univName === name);
  if (marker) marker.openPopup();
  document.querySelectorAll('.univ-item').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`.univ-item[data-name="${name}"]`);
  if (el) { el.classList.add('selected'); el.scrollIntoView({block:'nearest'}); }
}

// ── INIT ──
buildSidebar();
// Leaflet 컨테이너 높이 명시 (flex 계산 전 0일 수 있음)
(function() {
  const fb = document.querySelector('.filter-bar');
  const h = window.innerHeight - (fb ? fb.offsetHeight : 0);
  document.getElementById('mapContainer').style.height = h + 'px';
  document.getElementById('map').style.height = h + 'px';
  window.addEventListener('resize', () => {
    const h2 = window.innerHeight - (fb ? fb.offsetHeight : 0);
    document.getElementById('mapContainer').style.height = h2 + 'px';
    document.getElementById('map').style.height = h2 + 'px';
    if (map) map.invalidateSize();
  });
})();
initLeafletMap();
</script>
</body>
</html>
