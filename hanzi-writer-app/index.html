<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자 필순 연습</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="data.js"></script>
    <style>
        :root {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface2: #22223a;
            --border: #2d2d4a;
            --text: #e8e8f0;
            --text-dim: #8888aa;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --success: #4ecdc4;
            --danger: #ff6b6b;
            --warning: #ffd93d;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 32px 16px 16px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 4px;
        }

        .total-count {
            display: inline-block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            color: var(--accent-light);
            margin-top: 8px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        /* Search */
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 20px;
            color: var(--text);
            font-size: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-dim); font-size: 16px; }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent-light); }
        .btn-success { background: var(--success); color: #111; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }

        /* Category tabs */
        .category-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .cat-tab {
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cat-tab:hover { border-color: var(--accent); color: var(--text); }

        .cat-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .cat-tab .cat-count {
            font-size: 11px;
            opacity: 0.7;
        }

        /* Character grid */
        .char-grid-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        .char-grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .char-grid-title {
            font-size: 16px;
            font-weight: 600;
        }

        .char-grid-meta {
            font-size: 12px;
            color: var(--text-dim);
        }

        .char-search-filter {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            width: 200px;
            margin-bottom: 12px;
        }

        .char-search-filter:focus { border-color: var(--accent); }
        .char-search-filter::placeholder { color: var(--text-dim); }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 6px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .char-grid::-webkit-scrollbar { width: 6px; }
        .char-grid::-webkit-scrollbar-track { background: var(--surface2); border-radius: 3px; }
        .char-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .char-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            background: var(--surface2);
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 72px;
        }

        .char-cell:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.15);
        }

        .char-cell.selected {
            border-color: var(--accent);
            background: rgba(108, 99, 255, 0.15);
        }

        .char-cell .hz { font-size: 28px; line-height: 1.2; }
        .char-cell .rd { font-size: 10px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        /* Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .card-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .writer-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .writer-container {
            background: var(--surface2);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .writer-container svg { display: block; }

        .grid-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .grid-bg line {
            stroke: #333355;
            stroke-width: 1;
            stroke-dasharray: 6, 4;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        /* Stats */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .stat-value { font-size: 26px; font-weight: 700; }
        .stat-value.accent { color: var(--accent-light); }
        .stat-value.success { color: var(--success); }
        .stat-value.danger { color: var(--danger); }
        .stat-value.warning { color: var(--warning); }
        .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Info panel */
        .info-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        .char-info { display: flex; align-items: center; gap: 20px; }
        .char-big { font-size: 64px; line-height: 1; color: var(--accent-light); }
        .char-details h2 { font-size: 18px; margin-bottom: 4px; }
        .char-details p { color: var(--text-dim); font-size: 13px; line-height: 1.5; }
        .tag { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px; font-size: 11px; color: var(--accent-light); margin-right: 4px; }

        .quiz-feedback { text-align: center; margin-top: 10px; font-size: 13px; min-height: 18px; color: var(--text-dim); }

        .speed-control { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 10px; }
        .speed-control label { font-size: 12px; color: var(--text-dim); }
        .speed-slider { -webkit-appearance: none; width: 100px; height: 4px; background: var(--border); border-radius: 2px; outline: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer; }

        /* History */
        .history-section { margin-top: 20px; }
        .history-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .history-item { width: 44px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: all 0.2s; }
        .history-item:hover { border-color: var(--accent); transform: scale(1.1); }

        .preset-label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: #111; padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: transform 0.3s ease; z-index: 100; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Stroke breakdown */
        .stroke-card { margin-bottom: 20px; }

        /* Responsive */
        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .char-info { flex-direction: column; text-align: center; }
            .char-grid { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
            .char-search-filter { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>한자 필순 연습</h1>
        <p>Hanzi Writer - 획순 애니메이션 & 쓰기 퀴즈</p>
        <div class="total-count" id="totalCount"></div>
    </header>

    <div class="container">
        <!-- Search -->
        <div class="search-section">
            <input type="text" class="search-input" id="charInput" placeholder="한자 또는 훈음 검색 (예: 愛, 사랑, 물)" maxlength="20">
            <button class="btn btn-primary" onclick="handleSearch()">검색</button>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs"></div>

        <!-- Character Grid -->
        <div class="char-grid-section" id="charGridSection">
            <div class="char-grid-header">
                <div class="char-grid-title" id="gridTitle">전체 한자</div>
                <div class="char-grid-meta" id="gridMeta"></div>
            </div>
            <input type="text" class="char-search-filter" id="gridFilter" placeholder="카테고리 내 필터..." oninput="filterGrid()">
            <div class="char-grid" id="charGrid"></div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel" id="infoPanel" style="display:none;">
            <div class="char-info">
                <div class="char-big" id="charBig"></div>
                <div class="char-details">
                    <h2 id="charName"></h2>
                    <p id="charDesc"></p>
                    <div id="charTags" style="margin-top:6px;"></div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar" style="display:none;">
            <div class="stat-card"><div class="stat-value accent" id="statStrokes">0</div><div class="stat-label">총 획수</div></div>
            <div class="stat-card"><div class="stat-value success" id="statCorrect">0</div><div class="stat-label">정답</div></div>
            <div class="stat-card"><div class="stat-value danger" id="statMistakes">0</div><div class="stat-label">오답</div></div>
            <div class="stat-card"><div class="stat-value warning" id="statCompleted">0</div><div class="stat-label">완료</div></div>
        </div>

        <!-- Main Area -->
        <div class="main-layout" id="mainArea" style="display:none;">
            <div class="card">
                <div class="card-title">획순 애니메이션</div>
                <div class="writer-wrap">
                    <div class="writer-container" style="width:280px;height:280px;">
                        <svg class="grid-bg" viewBox="0 0 280 280">
                            <line x1="140" y1="0" x2="140" y2="280"/>
                            <line x1="0" y1="140" x2="280" y2="140"/>
                            <line x1="0" y1="0" x2="280" y2="280"/>
                            <line x1="280" y1="0" x2="0" y2="280"/>
                        </svg>
                        <div id="animTarget"></div>
                    </div>
                </div>
                <div class="speed-control">
                    <label>속도</label>
                    <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="3" step="0.5" value="1">
                    <span id="speedValue" style="font-size:12px;color:var(--text-dim);">1x</span>
                </div>
                <div class="controls" style="margin-top:14px;">
                    <button class="btn btn-primary btn-sm" onclick="playAnimation()">재생</button>
                    <button class="btn btn-outline btn-sm" onclick="loopAnimation()">반복</button>
                    <button class="btn btn-outline btn-sm" onclick="pauseAnim()">일시정지</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">쓰기 연습</div>
                <div class="writer-wrap">
                    <div class="writer-container" style="width:280px;height:280px;">
                        <svg class="grid-bg" viewBox="0 0 280 280">
                            <line x1="140" y1="0" x2="140" y2="280"/>
                            <line x1="0" y1="140" x2="280" y2="140"/>
                            <line x1="0" y1="0" x2="280" y2="280"/>
                            <line x1="280" y1="0" x2="0" y2="280"/>
                        </svg>
                        <div id="quizTarget"></div>
                    </div>
                </div>
                <div class="quiz-feedback" id="quizFeedback">한자를 선택한 후 퀴즈를 시작하세요</div>
                <div class="controls" style="margin-top:10px;">
                    <button class="btn btn-success btn-sm" onclick="startQuiz()">퀴즈 시작</button>
                    <button class="btn btn-outline btn-sm" onclick="startQuiz(true)">윤곽 없이</button>
                    <button class="btn btn-outline btn-sm" onclick="showHint()">힌트</button>
                </div>
            </div>
        </div>

        <!-- Stroke breakdown -->
        <div class="card stroke-card" id="strokeCard" style="display:none;">
            <div class="card-title">획 분석</div>
            <div id="strokeBreakdown" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;"></div>
        </div>

        <!-- History -->
        <div class="history-section" id="historySection" style="display:none;">
            <div class="preset-label">연습 기록</div>
            <div class="history-grid" id="historyGrid"></div>
        </div>
    </div>

    <footer style="background:var(--surface);border-top:1px solid var(--border);padding:32px 16px;margin-top:40px;text-align:center;">
        <div style="max-width:700px;margin:0 auto;">
            <div style="font-size:18px;font-weight:700;margin-bottom:8px;">박정원 | 朴正元 | Park Jeong Weon 교수</div>
            <div style="color:var(--text-dim);font-size:13px;line-height:2;">
                한국외국어대학교 중국학대학 중국언어문화학부<br>
                Division of Chinese Language, Literature and Culture<br>
                국가교육위원회 AI특별위원회 위원<br>
                교육부 AI인재양성추진단<br>
                <a href="https://k-ai.it.kr/" target="_blank" rel="noopener" style="color:var(--accent-light);text-decoration:none;">K-AI 교육네트워크</a>
            </div>
            <div style="margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <a href="https://kletter.kr" target="_blank" rel="noopener" style="color:var(--success);text-decoration:none;font-size:13px;background:var(--surface2);padding:6px 14px;border-radius:8px;border:1px solid var(--border);">kletter.kr</a>
                <a href="https://kteacher.kr" target="_blank" rel="noopener" style="color:var(--success);text-decoration:none;font-size:13px;background:var(--surface2);padding:6px 14px;border-radius:8px;border:1px solid var(--border);">kteacher.kr</a>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        let animWriter = null;
        let quizWriter = null;
        let currentChar = '';
        let currentCategory = 'all';
        let currentChars = [];
        let stats = { correct: 0, mistakes: 0, completed: 0, strokes: 0 };
        let history = JSON.parse(localStorage.getItem('hanzi_history') || '[]');
        let currentStrokeNum = 0;

        const charLookup = {};

        function init() {
            let total = 0;
            HANZI_CATEGORIES.forEach(function(cat) {
                cat.chars.forEach(function(c) {
                    charLookup[c[0]] = { char: c[0], reading: c[1], meaning: c[2], category: cat.name };
                    total++;
                });
            });
            document.getElementById('totalCount').textContent = total + '자 수록';

            renderCategoryTabs();
            selectCategory('all');
            renderHistory();

            document.getElementById('charInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleSearch();
            });

            document.getElementById('speedSlider').addEventListener('input', function() {
                document.getElementById('speedValue').textContent = this.value + 'x';
            });
        }

        function renderCategoryTabs() {
            var tabs = document.getElementById('categoryTabs');
            var totalChars = 0;
            HANZI_CATEGORIES.forEach(function(c) { totalChars += c.chars.length; });

            var html = '<div class="cat-tab active" data-cat="all" onclick="selectCategory(\'all\')">전체 <span class="cat-count">' + totalChars + '</span></div>';
            HANZI_CATEGORIES.forEach(function(cat) {
                html += '<div class="cat-tab" data-cat="' + cat.id + '" onclick="selectCategory(\'' + cat.id + '\')">'
                    + cat.icon + ' ' + cat.name + ' <span class="cat-count">' + cat.chars.length + '</span></div>';
            });
            tabs.innerHTML = html;
        }

        function selectCategory(catId) {
            currentCategory = catId;
            document.getElementById('gridFilter').value = '';

            document.querySelectorAll('.cat-tab').forEach(function(t) {
                t.classList.toggle('active', t.dataset.cat === catId);
            });

            if (catId === 'all') {
                currentChars = [];
                HANZI_CATEGORIES.forEach(function(cat) {
                    cat.chars.forEach(function(c) {
                        currentChars.push(c);
                    });
                });
                document.getElementById('gridTitle').textContent = '전체 한자';
            } else {
                var cat = HANZI_CATEGORIES.find(function(c) { return c.id === catId; });
                if (!cat) return;
                currentChars = cat.chars;
                document.getElementById('gridTitle').textContent = cat.icon + ' ' + cat.name;
            }

            renderCharGrid(currentChars);
        }

        function renderCharGrid(chars) {
            var grid = document.getElementById('charGrid');
            document.getElementById('gridMeta').textContent = chars.length + '자';

            if (chars.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-dim);">검색 결과 없음</div>';
                return;
            }

            var html = '';
            chars.forEach(function(c) {
                var sel = c[0] === currentChar ? ' selected' : '';
                html += '<div class="char-cell' + sel + '" onclick="selectChar(\'' + c[0] + '\')" title="' + c[1] + ' - ' + c[2] + '">'
                    + '<span class="hz">' + c[0] + '</span>'
                    + '<span class="rd">' + c[1] + '</span>'
                    + '</div>';
            });
            grid.innerHTML = html;
        }

        function filterGrid() {
            var q = document.getElementById('gridFilter').value.trim().toLowerCase();
            if (!q) {
                renderCharGrid(currentChars);
                return;
            }
            var filtered = currentChars.filter(function(c) {
                return c[0].indexOf(q) !== -1 || c[1].indexOf(q) !== -1 || c[2].indexOf(q) !== -1;
            });
            renderCharGrid(filtered);
        }

        function handleSearch() {
            var q = document.getElementById('charInput').value.trim();
            if (!q) return;

            if (/[一-鿿㐀-䶿]/.test(q.charAt(0))) {
                selectChar(q.charAt(0));
                return;
            }

            var results = [];
            HANZI_CATEGORIES.forEach(function(cat) {
                cat.chars.forEach(function(c) {
                    if (c[1].indexOf(q) !== -1 || c[2].indexOf(q) !== -1) {
                        results.push(c);
                    }
                });
            });

            if (results.length > 0) {
                currentChars = results;
                currentCategory = 'search';
                document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
                document.getElementById('gridTitle').textContent = '"' + q + '" 검색 결과';
                renderCharGrid(results);
                if (results.length === 1) selectChar(results[0][0]);
            } else {
                showToast('검색 결과 없음: ' + q);
            }
        }

        function selectChar(char) {
            document.getElementById('charInput').value = char;
            currentChar = char;

            addToHistory(char);
            showInfo(char);

            document.getElementById('mainArea').style.display = 'grid';
            document.getElementById('statsBar').style.display = 'grid';
            document.getElementById('strokeCard').style.display = 'block';

            document.querySelectorAll('.char-cell').forEach(function(el) {
                el.classList.toggle('selected', el.querySelector('.hz').textContent === char);
            });

            createAnimWriter(char);
            createQuizWriter(char);
            loadStrokeBreakdown(char);

            document.getElementById('infoPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function createAnimWriter(char) {
            document.getElementById('animTarget').innerHTML = '';
            animWriter = HanziWriter.create('animTarget', char, {
                width: 280, height: 280, padding: 20,
                strokeColor: '#6c63ff', outlineColor: '#2d2d4a', radicalColor: '#4ecdc4',
                strokeAnimationSpeed: parseFloat(document.getElementById('speedSlider').value),
                delayBetweenStrokes: 300, delayBetweenLoops: 1500,
                onLoadCharDataSuccess: function(data) {
                    stats.strokes = data.strokes.length;
                    document.getElementById('statStrokes').textContent = stats.strokes;
                },
                onLoadCharDataError: function() { showToast('한자 데이터를 찾을 수 없습니다'); }
            });
        }

        function createQuizWriter(char) {
            document.getElementById('quizTarget').innerHTML = '';
            quizWriter = HanziWriter.create('quizTarget', char, {
                width: 280, height: 280, padding: 20,
                showCharacter: false,
                strokeColor: '#4ecdc4', outlineColor: '#2d2d4a',
                highlightColor: '#6c63ff', drawingColor: '#e8e8f0', drawingWidth: 5,
                showHintAfterMisses: 3,
                onLoadCharDataError: function() { showToast('한자 데이터를 찾을 수 없습니다'); }
            });
            document.getElementById('quizFeedback').textContent = '퀴즈 시작 버튼을 누르세요';
            currentStrokeNum = 0;
        }

        function loadStrokeBreakdown(char) {
            var container = document.getElementById('strokeBreakdown');
            container.innerHTML = '';
            HanziWriter.loadCharacterData(char).then(function(data) {
                for (var i = 0; i < data.strokes.length; i++) {
                    (function(idx) {
                        var wrap = document.createElement('div');
                        wrap.style.cssText = 'background:var(--surface2);border-radius:8px;padding:4px;cursor:pointer;transition:transform 0.2s;';
                        wrap.title = '획 ' + (idx + 1);
                        wrap.onmouseenter = function() { this.style.transform = 'scale(1.15)'; };
                        wrap.onmouseleave = function() { this.style.transform = 'scale(1)'; };

                        var svgNS = 'http://www.w3.org/2000/svg';
                        var svg = document.createElementNS(svgNS, 'svg');
                        svg.setAttribute('width', '52');
                        svg.setAttribute('height', '52');
                        svg.setAttribute('viewBox', '0 0 1024 1024');
                        var g = document.createElementNS(svgNS, 'g');
                        g.setAttribute('transform', 'scale(1,-1) translate(0,-900)');
                        for (var j = 0; j <= idx; j++) {
                            var path = document.createElementNS(svgNS, 'path');
                            path.setAttribute('d', data.strokes[j]);
                            path.style.fill = j === idx ? '#6c63ff' : '#2d2d4a';
                            g.appendChild(path);
                        }
                        svg.appendChild(g);
                        wrap.appendChild(svg);

                        var num = document.createElement('div');
                        num.style.cssText = 'text-align:center;font-size:10px;color:var(--text-dim);';
                        num.textContent = idx + 1;
                        wrap.appendChild(num);

                        wrap.onclick = function() { if (animWriter) animWriter.animateStroke(idx); };
                        container.appendChild(wrap);
                    })(i);
                }
            });
        }

        function playAnimation() {
            if (!animWriter) return;
            animWriter.hideCharacter();
            setTimeout(function() {
                animWriter.animateCharacter({ onComplete: function() { showToast('애니메이션 완료'); } });
            }, 200);
        }

        function loopAnimation() { if (animWriter) animWriter.loopCharacterAnimation(); }
        function pauseAnim() { if (animWriter) animWriter.pauseAnimation(); }

        function startQuiz(noOutline) {
            if (!quizWriter) return;
            if (noOutline) { quizWriter.hideOutline(); } else { quizWriter.showOutline(); }
            stats.correct = 0;
            stats.mistakes = 0;
            currentStrokeNum = 0;
            updateStats();
            document.getElementById('quizFeedback').textContent = '첫 번째 획을 그려보세요';
            quizWriter.quiz({
                onMistake: function(data) {
                    stats.mistakes = data.totalMistakes;
                    updateStats();
                    document.getElementById('quizFeedback').textContent = '다시 시도! (획 ' + (data.strokeNum + 1) + ', 오답 ' + data.mistakesOnStroke + '회)';
                },
                onCorrectStroke: function(data) {
                    currentStrokeNum = data.strokeNum + 1;
                    stats.correct++;
                    updateStats();
                    if (data.strokesRemaining > 0) {
                        document.getElementById('quizFeedback').textContent = '정답! 다음 획 (' + (data.strokeNum + 2) + '/' + stats.strokes + ')';
                    }
                },
                onComplete: function(data) {
                    stats.completed++;
                    updateStats();
                    document.getElementById('quizFeedback').textContent = '완성! 총 오답: ' + data.totalMistakes + '회';
                    showToast('한자 "' + currentChar + '" 완성!');
                }
            });
        }

        function showHint() { if (animWriter) animWriter.animateStroke(currentStrokeNum); }

        function updateStats() {
            document.getElementById('statCorrect').textContent = stats.correct;
            document.getElementById('statMistakes').textContent = stats.mistakes;
            document.getElementById('statCompleted').textContent = stats.completed;
        }

        function showInfo(char) {
            var info = charLookup[char];
            var panel = document.getElementById('infoPanel');
            panel.style.display = 'block';
            document.getElementById('charBig').textContent = char;
            if (info) {
                document.getElementById('charName').textContent = info.meaning + ' ' + info.reading;
                document.getElementById('charDesc').textContent = info.category + ' 카테고리';
                document.getElementById('charTags').innerHTML = '<span class="tag">' + info.reading + '</span><span class="tag">' + info.category + '</span>';
            } else {
                document.getElementById('charName').textContent = char;
                document.getElementById('charDesc').textContent = '사용자 입력 한자';
                document.getElementById('charTags').innerHTML = '<span class="tag">사용자 입력</span>';
            }
        }

        function addToHistory(char) {
            history = history.filter(function(c) { return c !== char; });
            history.push(char);
            if (history.length > 30) history = history.slice(-30);
            localStorage.setItem('hanzi_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) { document.getElementById('historySection').style.display = 'none'; return; }
            document.getElementById('historySection').style.display = 'block';
            var unique = history.slice(-20);
            document.getElementById('historyGrid').innerHTML = unique.map(function(c) {
                return '<div class="history-item" onclick="selectChar(\'' + c + '\')">' + c + '</div>';
            }).join('');
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }

        init();
    </script>
</body>
</html>
