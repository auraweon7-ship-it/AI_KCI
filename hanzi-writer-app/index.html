<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자 필순 연습</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        :root {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface2: #22223a;
            --border: #2d2d4a;
            --text: #e8e8f0;
            --text-dim: #8888aa;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --success: #4ecdc4;
            --danger: #ff6b6b;
            --warning: #ffd93d;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 32px 16px 16px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 4px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        /* Search */
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .search-input {
            flex: 1;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 20px;
            color: var(--text);
            font-size: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-dim);
            font-size: 16px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }

        .btn-success {
            background: var(--success);
            color: #111;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Preset */
        .preset-section {
            margin-bottom: 24px;
        }

        .preset-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .preset-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: var(--accent);
            background: var(--surface2);
        }

        .preset-btn .char {
            font-size: 18px;
            margin-right: 4px;
        }

        /* Main Area */
        .main-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .card-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .writer-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .writer-container {
            background: var(--surface2);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .writer-container svg {
            display: block;
        }

        /* Grid overlay */
        .grid-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .grid-bg line {
            stroke: #333355;
            stroke-width: 1;
            stroke-dasharray: 6, 4;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        /* Stats */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-value.accent { color: var(--accent-light); }
        .stat-value.success { color: var(--success); }
        .stat-value.danger { color: var(--danger); }
        .stat-value.warning { color: var(--warning); }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Info panel */
        .info-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        .char-info {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .char-big {
            font-size: 72px;
            line-height: 1;
            color: var(--accent-light);
        }

        .char-details h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .char-details p {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            color: var(--accent-light);
            margin-right: 4px;
        }

        /* History */
        .history-section {
            margin-top: 24px;
        }

        .history-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .history-item {
            width: 48px;
            height: 48px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: var(--accent);
            transform: scale(1.1);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: #111;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Quiz feedback */
        .quiz-feedback {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
            color: var(--text-dim);
        }

        /* Speed control */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .speed-control label {
            font-size: 12px;
            color: var(--text-dim);
        }

        .speed-slider {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Mode indicator */
        .mode-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .mode-badge.animate {
            background: rgba(108, 99, 255, 0.2);
            color: var(--accent-light);
        }

        .mode-badge.quiz {
            background: rgba(78, 205, 196, 0.2);
            color: var(--success);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .main-area {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }

            .char-info {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>한자 필순 연습</h1>
        <p>Hanzi Writer - 획순 애니메이션 & 쓰기 퀴즈</p>
    </header>

    <div class="container">
        <!-- Search -->
        <div class="search-section">
            <input type="text" class="search-input" id="charInput" placeholder="한자 입력 (예: 愛)" maxlength="1">
            <button class="btn btn-primary" onclick="loadCharacter()">불러오기</button>
        </div>

        <!-- Presets -->
        <div class="preset-section">
            <div class="preset-label">자주 쓰는 한자</div>
            <div class="preset-grid" id="presetGrid"></div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel" id="infoPanel" style="display:none;">
            <div class="char-info">
                <div class="char-big" id="charBig"></div>
                <div class="char-details">
                    <h2 id="charName"></h2>
                    <p id="charDesc"></p>
                    <div id="charTags" style="margin-top:8px;"></div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar" style="display:none;">
            <div class="stat-card">
                <div class="stat-value accent" id="statStrokes">0</div>
                <div class="stat-label">총 획수</div>
            </div>
            <div class="stat-card">
                <div class="stat-value success" id="statCorrect">0</div>
                <div class="stat-label">정답</div>
            </div>
            <div class="stat-card">
                <div class="stat-value danger" id="statMistakes">0</div>
                <div class="stat-label">오답</div>
            </div>
            <div class="stat-card">
                <div class="stat-value warning" id="statCompleted">0</div>
                <div class="stat-label">완료</div>
            </div>
        </div>

        <!-- Main Area -->
        <div class="main-area" id="mainArea" style="display:none;">
            <!-- Animation -->
            <div class="card">
                <div class="card-title">획순 애니메이션</div>
                <div class="writer-wrap">
                    <div class="writer-container" id="animContainer" style="width:280px;height:280px;">
                        <svg class="grid-bg" viewBox="0 0 280 280">
                            <line x1="140" y1="0" x2="140" y2="280"/>
                            <line x1="0" y1="140" x2="280" y2="140"/>
                            <line x1="0" y1="0" x2="280" y2="280"/>
                            <line x1="280" y1="0" x2="0" y2="280"/>
                        </svg>
                        <div id="animTarget"></div>
                    </div>
                </div>
                <div class="speed-control">
                    <label>속도</label>
                    <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="3" step="0.5" value="1">
                    <span id="speedValue" style="font-size:12px;color:var(--text-dim);">1x</span>
                </div>
                <div class="controls" style="margin-top:16px;">
                    <button class="btn btn-primary" onclick="playAnimation()">재생</button>
                    <button class="btn btn-outline" onclick="loopAnimation()">반복</button>
                    <button class="btn btn-outline" onclick="pauseAnim()">일시정지</button>
                </div>
            </div>

            <!-- Quiz -->
            <div class="card">
                <div class="card-title">쓰기 연습</div>
                <div class="writer-wrap">
                    <div class="writer-container" id="quizContainer" style="width:280px;height:280px;">
                        <svg class="grid-bg" viewBox="0 0 280 280">
                            <line x1="140" y1="0" x2="140" y2="280"/>
                            <line x1="0" y1="140" x2="280" y2="140"/>
                            <line x1="0" y1="0" x2="280" y2="280"/>
                            <line x1="280" y1="0" x2="0" y2="280"/>
                        </svg>
                        <div id="quizTarget"></div>
                    </div>
                </div>
                <div class="quiz-feedback" id="quizFeedback">한자를 불러온 후 퀴즈를 시작하세요</div>
                <div class="controls" style="margin-top:12px;">
                    <button class="btn btn-success" onclick="startQuiz()">퀴즈 시작</button>
                    <button class="btn btn-outline" onclick="startQuiz(true)">윤곽 없이</button>
                    <button class="btn btn-outline" onclick="showHint()">힌트</button>
                </div>
            </div>
        </div>

        <!-- Stroke breakdown -->
        <div class="card" id="strokeCard" style="display:none; margin-bottom:24px;">
            <div class="card-title">획 분석</div>
            <div id="strokeBreakdown" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;"></div>
        </div>

        <!-- History -->
        <div class="history-section" id="historySection" style="display:none;">
            <div class="preset-label">연습 기록</div>
            <div class="history-grid" id="historyGrid"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const PRESETS = [
            { char: '人', name: '사람 인', desc: '사람의 모습을 본뜬 글자' },
            { char: '山', name: '뫼 산', desc: '산봉우리 세 개를 본뜬 글자' },
            { char: '水', name: '물 수', desc: '물이 흐르는 모양' },
            { char: '火', name: '불 화', desc: '불꽃이 타오르는 모양' },
            { char: '木', name: '나무 목', desc: '나무의 모양을 본뜸' },
            { char: '金', name: '쇠 금', desc: '금속, 돈을 뜻함' },
            { char: '土', name: '흙 토', desc: '땅 위에 흙이 쌓인 모양' },
            { char: '日', name: '날 일', desc: '태양의 모습' },
            { char: '月', name: '달 월', desc: '초승달의 모습' },
            { char: '大', name: '큰 대', desc: '사람이 팔을 벌린 모양' },
            { char: '天', name: '하늘 천', desc: '사람 위의 하늘' },
            { char: '中', name: '가운데 중', desc: '깃발이 중앙을 가리킴' },
            { char: '學', name: '배울 학', desc: '배움, 학문' },
            { char: '愛', name: '사랑 애', desc: '사랑하다, 아끼다' },
            { char: '心', name: '마음 심', desc: '심장의 모양' },
            { char: '力', name: '힘 력', desc: '팔에 힘을 준 모양' },
            { char: '王', name: '임금 왕', desc: '왕, 임금' },
            { char: '生', name: '날 생', desc: '풀이 땅에서 자라남' },
            { char: '道', name: '길 도', desc: '길, 도리' },
            { char: '德', name: '덕 덕', desc: '덕행, 인덕' },
            { char: '龍', name: '용 룡', desc: '용, 가장 복잡한 한자 중 하나' },
            { char: '花', name: '꽃 화', desc: '꽃, 꽃피다' },
            { char: '明', name: '밝을 명', desc: '해와 달이 합쳐져 밝음' },
            { char: '國', name: '나라 국', desc: '나라, 국가' },
        ];

        const CHAR_INFO = {};
        PRESETS.forEach(p => { CHAR_INFO[p.char] = p; });

        let animWriter = null;
        let quizWriter = null;
        let currentChar = '';
        let stats = { correct: 0, mistakes: 0, completed: 0, strokes: 0 };
        let history = JSON.parse(localStorage.getItem('hanzi_history') || '[]');
        let currentStrokeNum = 0;

        function init() {
            renderPresets();
            renderHistory();

            document.getElementById('charInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') loadCharacter();
            });

            document.getElementById('speedSlider').addEventListener('input', function() {
                document.getElementById('speedValue').textContent = this.value + 'x';
            });
        }

        function renderPresets() {
            const grid = document.getElementById('presetGrid');
            grid.innerHTML = PRESETS.map(p =>
                `<button class="preset-btn" onclick="loadChar('${p.char}')">
                    <span class="char">${p.char}</span> ${p.name}
                </button>`
            ).join('');
        }

        function renderHistory() {
            if (history.length === 0) {
                document.getElementById('historySection').style.display = 'none';
                return;
            }
            document.getElementById('historySection').style.display = 'block';
            const unique = [...new Set(history)].slice(-20);
            document.getElementById('historyGrid').innerHTML = unique.map(c =>
                `<div class="history-item" onclick="loadChar('${c}')">${c}</div>`
            ).join('');
        }

        function loadChar(char) {
            document.getElementById('charInput').value = char;
            loadCharacter();
        }

        function loadCharacter() {
            const input = document.getElementById('charInput').value.trim();
            if (!input) return;
            const char = input.charAt(0);
            currentChar = char;

            addToHistory(char);
            showInfo(char);

            document.getElementById('mainArea').style.display = 'grid';
            document.getElementById('statsBar').style.display = 'grid';
            document.getElementById('strokeCard').style.display = 'block';

            createAnimWriter(char);
            createQuizWriter(char);
            loadStrokeBreakdown(char);
        }

        function createAnimWriter(char) {
            const target = document.getElementById('animTarget');
            target.innerHTML = '';

            animWriter = HanziWriter.create('animTarget', char, {
                width: 280,
                height: 280,
                padding: 20,
                strokeColor: '#6c63ff',
                outlineColor: '#2d2d4a',
                radicalColor: '#4ecdc4',
                strokeAnimationSpeed: parseFloat(document.getElementById('speedSlider').value),
                delayBetweenStrokes: 300,
                delayBetweenLoops: 1500,
                onLoadCharDataSuccess: function(data) {
                    stats.strokes = data.strokes.length;
                    document.getElementById('statStrokes').textContent = stats.strokes;
                },
                onLoadCharDataError: function() {
                    showToast('한자 데이터를 찾을 수 없습니다');
                }
            });
        }

        function createQuizWriter(char) {
            const target = document.getElementById('quizTarget');
            target.innerHTML = '';

            quizWriter = HanziWriter.create('quizTarget', char, {
                width: 280,
                height: 280,
                padding: 20,
                showCharacter: false,
                strokeColor: '#4ecdc4',
                outlineColor: '#2d2d4a',
                highlightColor: '#6c63ff',
                drawingColor: '#e8e8f0',
                drawingWidth: 5,
                showHintAfterMisses: 3,
                onLoadCharDataError: function() {
                    showToast('한자 데이터를 찾을 수 없습니다');
                }
            });

            document.getElementById('quizFeedback').textContent = '퀴즈 시작 버튼을 누르세요';
            currentStrokeNum = 0;
        }

        function loadStrokeBreakdown(char) {
            const container = document.getElementById('strokeBreakdown');
            container.innerHTML = '';

            HanziWriter.loadCharacterData(char).then(function(data) {
                for (let i = 0; i < data.strokes.length; i++) {
                    const wrap = document.createElement('div');
                    wrap.style.cssText = 'background:var(--surface2);border-radius:8px;padding:4px;cursor:pointer;transition:transform 0.2s;';
                    wrap.title = '획 ' + (i + 1);
                    wrap.addEventListener('mouseenter', function() { this.style.transform = 'scale(1.15)'; });
                    wrap.addEventListener('mouseleave', function() { this.style.transform = 'scale(1)'; });

                    const svgNS = 'http://www.w3.org/2000/svg';
                    const svg = document.createElementNS(svgNS, 'svg');
                    svg.setAttribute('width', '56');
                    svg.setAttribute('height', '56');
                    svg.setAttribute('viewBox', '0 0 1024 1024');

                    const g = document.createElementNS(svgNS, 'g');
                    g.setAttribute('transform', 'scale(1,-1) translate(0,-900)');

                    for (let j = 0; j <= i; j++) {
                        const path = document.createElementNS(svgNS, 'path');
                        path.setAttribute('d', data.strokes[j]);
                        path.style.fill = j === i ? '#6c63ff' : '#2d2d4a';
                        g.appendChild(path);
                    }

                    svg.appendChild(g);
                    wrap.appendChild(svg);

                    const num = document.createElement('div');
                    num.style.cssText = 'text-align:center;font-size:10px;color:var(--text-dim);';
                    num.textContent = i + 1;
                    wrap.appendChild(num);

                    wrap.addEventListener('click', function() {
                        if (animWriter) animWriter.animateStroke(i);
                    });

                    container.appendChild(wrap);
                }
            });
        }

        function playAnimation() {
            if (!animWriter) return;
            animWriter.hideCharacter();
            setTimeout(function() {
                animWriter.animateCharacter({
                    onComplete: function() {
                        showToast('애니메이션 완료');
                    }
                });
            }, 200);
        }

        function loopAnimation() {
            if (!animWriter) return;
            animWriter.loopCharacterAnimation();
        }

        function pauseAnim() {
            if (!animWriter) return;
            animWriter.pauseAnimation();
        }

        function startQuiz(noOutline) {
            if (!quizWriter) return;

            if (noOutline) {
                quizWriter.hideOutline();
            } else {
                quizWriter.showOutline();
            }

            stats.correct = 0;
            stats.mistakes = 0;
            currentStrokeNum = 0;
            updateStats();

            document.getElementById('quizFeedback').textContent = '첫 번째 획을 그려보세요';

            quizWriter.quiz({
                onMistake: function(data) {
                    stats.mistakes = data.totalMistakes;
                    updateStats();
                    document.getElementById('quizFeedback').textContent =
                        '다시 시도! (획 ' + (data.strokeNum + 1) + ', 오답 ' + data.mistakesOnStroke + '회)';
                },
                onCorrectStroke: function(data) {
                    currentStrokeNum = data.strokeNum + 1;
                    stats.correct++;
                    updateStats();
                    if (data.strokesRemaining > 0) {
                        document.getElementById('quizFeedback').textContent =
                            '정답! 다음 획 (' + (data.strokeNum + 2) + '/' + stats.strokes + ')';
                    }
                },
                onComplete: function(data) {
                    stats.completed++;
                    updateStats();
                    document.getElementById('quizFeedback').textContent =
                        '완성! 총 오답: ' + data.totalMistakes + '회';
                    showToast('한자 "' + currentChar + '" 완성!');
                }
            });
        }

        function showHint() {
            if (!animWriter) return;
            animWriter.animateStroke(currentStrokeNum);
        }

        function updateStats() {
            document.getElementById('statCorrect').textContent = stats.correct;
            document.getElementById('statMistakes').textContent = stats.mistakes;
            document.getElementById('statCompleted').textContent = stats.completed;
        }

        function showInfo(char) {
            const info = CHAR_INFO[char];
            const panel = document.getElementById('infoPanel');
            panel.style.display = 'block';

            document.getElementById('charBig').textContent = char;

            if (info) {
                document.getElementById('charName').textContent = info.name;
                document.getElementById('charDesc').textContent = info.desc;
                document.getElementById('charTags').innerHTML =
                    '<span class="tag">한자</span><span class="tag">필순연습</span>';
            } else {
                document.getElementById('charName').textContent = char;
                document.getElementById('charDesc').textContent = '사용자 입력 한자';
                document.getElementById('charTags').innerHTML = '<span class="tag">사용자 입력</span>';
            }
        }

        function addToHistory(char) {
            history = history.filter(c => c !== char);
            history.push(char);
            if (history.length > 30) history = history.slice(-30);
            localStorage.setItem('hanzi_history', JSON.stringify(history));
            renderHistory();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }

        init();
    </script>
</body>
</html>
